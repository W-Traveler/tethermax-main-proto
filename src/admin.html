  .pv { position: relative; height: 150px; border-radius: 10px; overflow: hidden; isolation: isolate; color: #fff; display: flex; align-items: flex-end; }

<script>
  const EN = new URLSearchParams(location.search).get('lang') === 'en';
  const hv = (k) => (location.hash.match(new RegExp('[#&]' + k + '=([\\w.]+)')) || [])[1];
  // 영문 보기: 키 = 화면 국문
  const DICT = {
    '검색': 'Search', '프리로그인 랜딩 페이지': 'Pre-login landing page', '메인 관리': 'Main page', '웹 메인 배너 관리': 'Web main banners', '신규': 'New', '회원관리': 'Members', '페이백': 'Cashback', '거래소': 'Exchanges', '거래소 리뷰': 'Exchange reviews', '이벤트': 'Events', '공지': 'Notices', '푸시': 'Push', '엑셀': 'Excel', '쿠폰': 'Coupons',
    '1024px 이상 웹 메인 맨 위 왼쪽 칸에 노출. 저장하면 바로 반영되고, 노출 기간 설정은 없습니다.': 'Shown in the top-left slot of the web main page (1024px and up). Changes go live on save. No display period setting.',
    '항목 추가': 'Add item', '선택 항목 삭제': 'Delete selected', '취소': 'Cancel', '저장': 'Save',
    '저장하지 않은 변경을 버릴까요?': 'Discard unsaved changes?', '마지막으로 저장한 상태로 돌아갑니다.': 'Goes back to the last saved state.', '계속 편집': 'Keep editing', '버리기': 'Discard',
  };
  const L = (ko, en) => (EN ? en : ko);
  if (EN) { document.documentElement.lang = 'en'; document.querySelectorAll('[data-k]').forEach((el) => { if (DICT[el.dataset.k]) el.textContent = DICT[el.dataset.k]; }); }

  // 링크 페이지 목록 (미결 #7 가안)
  const PAGES = [
    ['dex', 'DEX 거래소 목록', 'DEX exchange list'], ['boost', '페이백 부스트 안내', 'Cashback Boost'], ['hub', 'Cashback Hub', 'Cashback Hub'],
    ['calc', '페이백 계산기', 'Cashback calculator'], ['event', '이벤트 상세', 'Event detail'],
  ];
  const ex = (img, tKo, tEn, sKo, sEn, page, url) => ({ img, tKo, tEn, sKo, sEn, lt: url ? 'url' : 'page', page: page || '', url: url || '' });
  // 첫 등록 콘텐츠 (REQ-A-013) + 두 번째 항목은 예시 (메인 프로토타입의 두 번째 배너와 같은 내용)
  const SEED = {
    linked: [
      ex('dex', '이제 DEX도 페이백 받아보세요', 'Get cashback on DEXs now', 'KYC 없이 지갑 주소만 입력하면 돼요', 'No KYC. Just enter your wallet address.', 'dex'),
      ex('gold', '친구 초대하고 골드 바 받아가세요', 'Invite a friend, get a gold bar', '친구를 초대하면 리워드를 더 받아요.', 'Invite friends to earn more rewards.', 'event'),
      ex('calc', '매달 내는 수수료, 돌려받을 수 있어요', 'Get back your monthly fees', '거래량만 넣으면 한 달 페이백을 바로 알려드려요.', 'Enter your volume and see your monthly cashback.', 'calc'),
      ex('boost', '거래소 이벤트 모아 보기', 'All exchange events', '진행 중인 거래소 이벤트를 한 번에 확인하세요.', 'See every running exchange event at once.', 'event'),
      ex('dex', 'DEX 페이백 반영 주기 안내', 'DEX cashback update cycle', '거래소마다 페이백이 들어오는 주기가 달라요.', 'Each DEX updates cashback on its own cycle.', 'hub'),
    ],
    unlinked: [
      ex('boost', '첫 연동이면 페이백을 더 얹어드려요', 'First time here? Your cashback comes boosted', 'UID를 처음 연동할 때 한 번 드리는 혜택이에요.', 'A one-time bonus when you link a UID for the first time.', 'boost'),
      ex('calc', '매달 내는 수수료, 돌려받을 수 있어요', 'Get back your monthly fees', '거래량만 넣으면 한 달 페이백을 바로 알려드려요.', 'Enter your volume and see your monthly cashback.', 'calc'),
    ],
  };
  const n = +hv('n') || 2;   // 연동용 항목 수 (기본 2, n=1 · n=5 케이스)
  const saved = { linked: SEED.linked.slice(0, Math.max(1, Math.min(5, n))), unlinked: SEED.unlinked.slice() };
  // ld=1: 연동용 두 번째 항목을 주소 직접 입력으로
  if (hv('ld') === '1' && saved.linked[1]) saved.linked[1] = { ...saved.linked[1], lt: 'url', page: '', url: 'https://example.com/event/gold-bar' };
  const hist = { linked: ['2026-11-02 18:40', 'admin_01'], unlinked: ['2026-11-02 18:42', 'admin_01'] };
  const MAX = 5;
  let tab = hv('tab') === 'unlinked' ? 'unlinked' : 'linked';
  const clone = (a) => a.map((x) => ({ ...x }));
  const draft = { linked: clone(saved.linked), unlinked: clone(saved.unlinked) };
  const sel = { linked: new Set(), unlinked: new Set() };
  let errs = {};   // { 'i:field': 문구 }
  let uid = 0;
  const key = (x) => x._k || (x._k = 'k' + (uid += 1));
  Object.values(draft).forEach((a) => a.forEach(key));
  const isDirty = (t) => JSON.stringify(draft[t].map(({ _k, _new, ...r }) => r)) !== JSON.stringify(saved[t].map(({ _k, _new, ...r }) => r));
  const $ = (s, r = document) => r.querySelector(s);
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function toast(msg) {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), 2600);
    if (window.devLog) window.devLog('toast', msg);
  }

  function paintTabs() {
    $('[data-bo-tabs]').innerHTML = [['linked', L('연동 회원용', 'Linked members'), L('상태 2 · 3 · 4', 'States 2 · 3 · 4')], ['unlinked', L('미연동 회원용', 'Not-linked members'), L('상태 1', 'State 1')]]
      .map(([v, a, b]) => `<button type="button" role="tab" class="tab h-12 text-[14px] font-semibold text-mute" data-bo-tab="${v}" aria-selected="${tab === v}">${a} <span class="font-normal text-[12px]">(${b})</span>${isDirty(v) ? `<span class="ml-1 inline-block w-1.5 h-1.5 rounded-full bg-[#F87171] align-middle" title="${L('저장 안 한 변경 있음', 'Unsaved changes')}"></span>` : ''}</button>`).join('');
  }

  function itemHtml(x, i, list) {
    const one = list.length === 1;
    const e = (f) => errs[i + ':' + f];
    const inv = (f) => (e(f) ? 'aria-invalid="true"' : '');
    const msg = (f) => (e(f) ? `<p class="err" data-bo-err>${esc(e(f))}</p>` : '');
    const title = EN ? x.tEn || x.tKo : x.tKo || x.tEn;
    const sub = EN ? x.sEn || x.sKo : x.sKo || x.sEn;
    const pv = x.img
      ? `<div class="pv"><span class="pv-img ${x.img.startsWith('blob:') ? '' : 'img-' + x.img}">${x.img.startsWith('blob:') ? `<img src="${x.img}" alt="">` : ''}</span><span class="tag">${L('미리보기', 'Preview')}</span><span class="pv-text"><span class="pv-t">${esc(title || L('(제목)', '(title)'))}</span>${sub ? `<span class="pv-s">${esc(sub)}</span>` : ''}</span></div>`
      : `<div class="pv-empty" ${inv('img')}><span>${L('PC 이미지 없음', 'No PC image')}<br><span class="text-[11px] text-faint">${L('권장 규격 미정 (미결 #2)', 'Spec TBD (open #2)')}</span></span></div>`;
    const lbl = (t, req) => `<span class="block mb-1 text-[12px] font-semibold text-ink">${t}${req ? ' <span class="text-[#F87171]">*</span>' : ` <span class="font-normal text-mute">${L('(선택)', '(optional)')}</span>`}</span>`;
    const inp = (f, v, ph) => `<input class="fld" data-f="${f}" value="${esc(v)}" placeholder="${esc(ph)}" ${inv(f)}>`;
    return `<li class="px-6 py-5" data-bo-item="${i + 1}" data-k2="${key(x)}">
      <div class="flex items-center gap-3">
        <input type="checkbox" class="w-4 h-4 accent-[#60A5FA]" data-bo-check aria-label="${L('배너', 'Banner')} ${i + 1} ${L('선택', 'select')}" ${sel[tab].has(key(x)) ? 'checked' : ''} ${one ? `disabled title="${L('목록마다 1개 이상 필요해 마지막 1개는 삭제할 수 없어요', 'Each list needs at least one item, so the last one cannot be deleted')}"` : ''}>
        <b class="text-[14px] text-ink">${L('배너', 'Banner')} ${i + 1}</b>
        ${x._new ? `<span class="text-[11px] font-semibold px-1.5 rounded bg-brand-soft text-brand">${L('새 항목', 'New')}</span>` : ''}
        <span data-bo-order class="ml-2 flex items-center gap-1">
          <button type="button" class="ib" data-bo-up aria-label="${L('위로', 'Move up')}" ${i === 0 ? 'disabled' : ''}><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 10l4-4 4 4"/></svg></button>
          <button type="button" class="ib" data-bo-down aria-label="${L('아래로', 'Move down')}" ${i === list.length - 1 ? 'disabled' : ''}><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6l4 4 4-4"/></svg></button>
          <span class="ml-1 text-[12px] text-mute">${L('노출 순서', 'Display order')} ${i + 1}</span>
        </span>
        ${one ? `<span data-bo-last class="ml-auto text-[12px] text-mute">${L('마지막 1개는 삭제할 수 없어요 (목록마다 1개 이상)', 'The last item cannot be deleted (at least one per list)')}</span>` : ''}
      </div>
      <div class="mt-3 grid grid-cols-[280px_minmax(0,1fr)] gap-6">
        <div data-bo-img>
          ${pv}
          <div class="mt-2 flex items-center gap-2">
            <button type="button" class="btn btn-line h-8 text-[12px]" data-bo-pick>${x.img ? L('이미지 변경', 'Change image') : L('이미지 선택', 'Choose image')}</button>
            <span class="text-[11.5px] text-mute">${L('PC 이미지 1장 · 모바일 이미지 칸 없음', 'One PC image · no mobile image')}</span>
          </div>
          ${msg('img')}
        </div>
        <div class="min-w-0 space-y-4">
          <div data-bo-texts class="grid grid-cols-2 gap-x-4 gap-y-3">
            <label class="block">${lbl(L('제목 (국문)', 'Title (KO)'), true)}${inp('tKo', x.tKo, L('제목', 'Title'))}${msg('tKo')}</label>
            <label class="block">${lbl(L('제목 (영문)', 'Title (EN)'), true)}${inp('tEn', x.tEn, 'Title')}${msg('tEn')}</label>
            <label class="block">${lbl(L('부제목 (국문)', 'Subtitle (KO)'))}${inp('sKo', x.sKo, L('부제목', 'Subtitle'))}</label>
            <label class="block">${lbl(L('부제목 (영문)', 'Subtitle (EN)'))}${inp('sEn', x.sEn, 'Subtitle')}</label>
          </div>
          <fieldset data-bo-link>
            <legend class="mb-1.5 text-[12px] font-semibold text-ink">${L('링크', 'Link')} <span class="text-[#F87171]">*</span> <span class="font-normal text-mute">${L('배너 전체 선택 시 이동 · 버튼 문구 · 닫기 설정 없음', 'Whole banner is the link · no button text or close option')}</span></legend>
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="flex items-center gap-1.5 mb-1 text-[12.5px] text-ink"><input type="radio" name="lt-${key(x)}" value="page" data-f="lt" ${x.lt === 'page' ? 'checked' : ''} class="accent-[#60A5FA]">${L('페이지 목록에서 선택', 'Choose from page list')}</label>
                <select class="fld" data-f="page" ${x.lt !== 'page' ? 'disabled' : ''} ${inv('page')}>
                  <option value="">${L('페이지 선택', 'Select a page')}</option>
                  ${PAGES.map(([v, ko, en]) => `<option value="${v}" ${x.page === v ? 'selected' : ''}>${L(ko, en)}</option>`).join('')}
                </select>${msg('page')}
              </div>
              <div>
                <label class="flex items-center gap-1.5 mb-1 text-[12.5px] text-ink"><input type="radio" name="lt-${key(x)}" value="url" data-f="lt" ${x.lt === 'url' ? 'checked' : ''} class="accent-[#60A5FA]">${L('주소 직접 입력 (목록에 없을 때)', 'Enter URL (if not in the list)')}</label>
                <input class="fld" data-f="url" value="${esc(x.url)}" placeholder="https://" ${x.lt !== 'url' ? 'disabled' : ''} ${inv('url')}>${msg('url')}
              </div>
            </div>
          </fieldset>
        </div>
      </div>
    </li>`;
  }

  function paint() {
    const list = draft[tab];
    paintTabs();
    $('[data-bo-count]').innerHTML = `${L('항목', 'Items')} <span data-bo-num>${list.length}</span> / ${MAX}`;
    const add = $('[data-bo-add]'); add.disabled = list.length >= MAX;
    add.title = add.disabled ? L('목록마다 최대 5개', 'Up to 5 per list') : '';
    const s = sel[tab];
    [...s].forEach((k) => { if (!list.some((x) => key(x) === k)) s.delete(k); });
    const del = $('[data-bo-del]'); const all = s.size && s.size >= list.length;
    del.disabled = !s.size || all;
    $('[data-bo-tool-msg]').textContent = list.length >= MAX ? L('최대 5개까지 등록할 수 있어요', 'You can add up to 5 items')
      : all ? L('목록마다 1개 이상 남겨야 해요', 'Keep at least one item in each list')
        : s.size ? L(`${s.size}개 선택 · 삭제는 저장해야 반영돼요`, `${s.size} selected · deletion applies on save`) : '';
    $('[data-bo-list]').innerHTML = list.map((x, i) => itemHtml(x, i, list)).join('');
    $('[data-bo-hist]').innerHTML = `${L('마지막 저장', 'Last saved')} <b class="font-semibold text-body">${hist[tab][0]}</b> · ${hist[tab][1]}`;
    $('[data-bo-dirty]').textContent = isDirty(tab) ? L('저장하지 않은 변경이 있어요', 'You have unsaved changes') : '';
  }

  // ---------- 조작 ----------
  const itemOf = (el) => { const li = el.closest('[data-bo-item]'); return li ? +li.dataset.boItem - 1 : -1; };
  let pickFor = -1;
  document.addEventListener('click', (e) => {
    const t = e.target;
    const tb = t.closest('[data-bo-tab]'); if (tb) { tab = tb.dataset.boTab; errs = {}; paint(); return; }
    const list = draft[tab];
    if (t.closest('[data-bo-add]')) {
      if (list.length >= MAX) return;
      const x = ex('', '', '', '', '', ''); x._new = true; key(x); list.push(x);
      paint();
      const li = document.querySelector(`[data-bo-item="${list.length}"]`); if (li) li.scrollIntoView({ block: 'center' });
      return;
    }
    if (t.closest('[data-bo-del]')) {
      const s = sel[tab]; if (!s.size || s.size >= list.length) return;
      draft[tab] = list.filter((x) => !s.has(key(x))); s.clear(); errs = {}; paint();
      toast(L('선택한 항목을 뺐어요. 저장하면 반영돼요', 'Removed the selected items. Save to apply'));
      return;
    }
    const up = t.closest('[data-bo-up]'), dn = t.closest('[data-bo-down]');
    if (up || dn) {
      const i = itemOf(t), j = up ? i - 1 : i + 1;
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]]; errs = {}; paint();
      return;
    }
    if (t.closest('[data-bo-pick]')) { pickFor = itemOf(t); $('[data-bo-file]').click(); return; }
    if (t.closest('[data-bo-save]')) { save(); return; }
    if (t.closest('[data-bo-cancel]')) {
      if (!isDirty(tab)) { toast(L('바뀐 내용이 없어요', 'Nothing changed')); return; }
      $('[data-bo-confirm-wrap]').hidden = false; $('[data-bo-keep]').focus(); return;
    }
    if (t.closest('[data-bo-keep]') || t.matches('[data-bo-confirm-wrap]')) { $('[data-bo-confirm-wrap]').hidden = true; return; }
    if (t.closest('[data-bo-discard]')) {
      $('[data-bo-confirm-wrap]').hidden = true;
      draft[tab] = clone(saved[tab]); sel[tab].clear(); errs = {}; paint();
      toast(L('저장하지 않은 변경을 버렸어요', 'Discarded unsaved changes'));
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('[data-bo-confirm-wrap]').hidden) $('[data-bo-confirm-wrap]').hidden = true; });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-bo-check]')) { const x = draft[tab][itemOf(t)]; if (t.checked) sel[tab].add(key(x)); else sel[tab].delete(key(x)); paint(); return; }
    if (t.matches('[data-bo-file]')) {
      const f = t.files && t.files[0]; if (f && pickFor >= 0) { draft[tab][pickFor].img = URL.createObjectURL(f); delete errs[pickFor + ':img']; paint(); }
      t.value = ''; return;
    }
    if (t.matches('[data-f]')) {
      const i = itemOf(t); const x = draft[tab][i]; if (!x) return;
      if (t.dataset.f === 'lt') { x.lt = t.value; if (x.lt === 'page') x.url = ''; else x.page = ''; delete errs[i + ':page']; delete errs[i + ':url']; paint(); return; }
      x[t.dataset.f] = t.value.trim(); delete errs[i + ':' + t.dataset.f]; paint();
    }
  });
  // 글자를 칠 때마다 미리보기 갱신 (다시 그리면 초점을 잃으므로 미리보기 글자만 바꾼다)
  document.addEventListener('input', (e) => {
    const t = e.target; if (!t.matches('input[data-f]') || t.type === 'radio') return;
    const i = itemOf(t); const x = draft[tab][i]; if (!x) return;
    x[t.dataset.f] = t.value;
    const li = t.closest('[data-bo-item]');
    const pt = li.querySelector('.pv-t'), ps = li.querySelector('.pv-s');
    if (pt && /^t/.test(t.dataset.f)) pt.textContent = (EN ? x.tEn || x.tKo : x.tKo || x.tEn) || L('(제목)', '(title)');
    if (ps && /^s/.test(t.dataset.f)) ps.textContent = EN ? x.sEn || x.sKo : x.sKo || x.sEn;
    $('[data-bo-dirty]').textContent = isDirty(tab) ? L('저장하지 않은 변경이 있어요', 'You have unsaved changes') : '';
  });

  // REQ-A-012 입력 검증: 필수 값(미결 #3 가안: 이미지 · 제목 국문 · 영문 · 링크) · 주소 형식(https만)
  function save() {
    const list = draft[tab];
    errs = {};
    list.forEach((x, i) => {
      if (!x.img) errs[i + ':img'] = L('PC 이미지를 등록해 주세요', 'Add a PC image');
      if (!String(x.tKo).trim()) errs[i + ':tKo'] = L('제목(국문)을 입력해 주세요', 'Enter the Korean title');
      if (!String(x.tEn).trim()) errs[i + ':tEn'] = L('제목(영문)을 입력해 주세요', 'Enter the English title');
      if (x.lt === 'page' && !x.page) errs[i + ':page'] = L('링크할 페이지를 선택해 주세요', 'Select a page to link');
      if (x.lt === 'url' && !/^https:\/\/[^\s]+\.[^\s]+/.test(x.url)) errs[i + ':url'] = L('https://로 시작하는 주소를 입력해 주세요', 'Enter a URL starting with https://');
    });
    if (Object.keys(errs).length) {
      paint();
      const first = document.querySelector('[aria-invalid="true"]');
      if (first) { first.scrollIntoView({ block: 'center' }); if (first.focus) first.focus({ preventScroll: true }); }
      toast(L('입력하지 않았거나 형식이 맞지 않는 칸이 있어요', 'Some fields are empty or in the wrong format'));
      if (window.devLog) window.devLog('ui', '저장 막음 — 입력 검증 오류 (REQ-A-012)');
      return;
    }
    list.forEach((x) => delete x._new);
    saved[tab] = clone(list);
    hist[tab] = ['2026-11-03 ' + new Date().toTimeString().slice(0, 5), 'admin_01'];
    sel[tab].clear(); paint();
    toast(L('저장했어요. 웹 메인에 바로 반영돼요', 'Saved. Live on the web main page now'));
    if (window.devLog) window.devLog('api', `웹 메인 배너 저장 (${tab === 'linked' ? '연동용' : '미연동용'} ${list.length}개, 목록 전체 · 캐시 무효화 NFR-A-001)`);
  }
  paint();
  if (window.lucide) lucide.createIcons();
</script>

<!-- [DEV] 개발 확인용 브리지 (proto.html과 같은 방식): 셸의 조작(tm:steps) · 번호 표시(tm:marks)를 받는다 -->
<script>
  (() => {
    const inShell = window.self !== window.top;
    const post = (msg) => { if (inShell) { try { parent.postMessage(msg, '*'); } catch (e) { /* 무시 */ } } };
    window.devLog = (kind, msg) => post({ type: 'tm:log', kind, msg });
    const visible = (sel) => [...document.querySelectorAll(sel)].find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function run(steps) {
      for (const sp of steps || []) {
        if (sp.wait) await wait(sp.wait);
        if (sp.click) { const el = visible(sp.click); if (el) el.click(); else window.devLog('warn', `조작 대상을 못 찾음: ${sp.click}`); await wait(sp.after || 120); }
        if (sp.hl) { await wait(60); const el = visible(sp.hl); if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' }); }
      }
      post({ type: 'tm:stepsDone' });
    }
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2147483000';
    document.body.appendChild(layer);
    let marks = [], showMarks = true, focusN = 0, lastVis = null, layerWas = null;
    const mst = document.createElement('style');
    mst.textContent = `
      .dev-mk{position:fixed;border:1.5px dashed #E5317A;border-radius:8px;box-sizing:border-box;transition:background-color .2s}
      .dev-mk.on{background:rgba(229,49,122,.08);border-style:solid;border-width:2px}
      .dev-mk b{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#E5317A;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
      .dev-mk.on b{transform:scale(1.15)}`;
    document.head.appendChild(mst);
    const resolve = (spec) => { const [sel, up] = spec.split(' ^'); let el = visible(sel.trim()); for (let i = 0; el && i < (+up || 0); i += 1) el = el.parentElement; return el; };
    const openLayer = () => [...document.querySelectorAll('[aria-modal="true"]')].reverse().find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden') || null;
    function drawMarks() {
      layer.style.display = showMarks ? '' : 'none';
      const top = openLayer();
      if (!!top !== layerWas) { layerWas = !!top; post({ type: 'tm:layer', open: layerWas }); }
      while (layer.children.length < marks.length) {
        const d = document.createElement('div'); d.className = 'dev-mk'; d.innerHTML = '<b></b>';
        d.firstChild.addEventListener('click', () => post({ type: 'tm:markClick', n: +d.dataset.n }));
        layer.appendChild(d);
      }
      const placed = [];
      [...layer.children].forEach((d, i) => {
        const m = marks[i]; const el = m && resolve(m.sel);
        const r = el && (!top || top.contains(el)) && el.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) { d.style.display = 'none'; return; }
        d.style.display = ''; d.dataset.n = m.n; d.firstChild.textContent = m.n;
        d.classList.toggle('on', focusN === m.n);
        d.style.left = (r.left - 3) + 'px'; d.style.top = (r.top - 3) + 'px';
        d.style.width = (r.width + 6) + 'px'; d.style.height = (r.height + 6) + 'px';
        let bx = r.left - 14; const by = r.top - 14;
        while (placed.some((p) => Math.abs(p.bx - bx) < 24 && Math.abs(p.by - by) < 24)) bx += 26;
        d.firstChild.style.left = (bx - (r.left - 3)) + 'px'; d.firstChild.style.top = '-11px';
        placed.push({ bx, by });
      });
      const vis = [...layer.children].filter((d) => d.style.display !== 'none' && d.dataset.n).map((d) => +d.dataset.n).filter((x) => marks.some((m) => m.n === x));
      const sig = vis.join(','); if (sig !== lastVis) { lastVis = sig; post({ type: 'tm:markVis', vis }); }
    }
    setInterval(drawMarks, 250);
    let raf = 0;
    window.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawMarks); }, { capture: true, passive: true });
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'tm:steps') run(d.steps);
      if (d.type === 'tm:marks') { marks = d.list || []; showMarks = d.show !== false; drawMarks(); }
      if (d.type === 'tm:markShow') { showMarks = !!d.show; drawMarks(); }
      if (d.type === 'tm:markGo') {
        const m = marks.find((x) => x.n === d.n); const el = m && resolve(m.sel);
        focusN = d.n;
        if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' });
        drawMarks(); setTimeout(() => { if (focusN === d.n) { focusN = 0; drawMarks(); } }, 2400);
      }
    });
    const ready = () => post({ type: 'tm:ready', env: { device: 'off', osPrompt: 'yes' } });
    if (document.readyState === 'complete') setTimeout(ready, 60); else window.addEventListener('load', () => setTimeout(ready, 60), { once: true });
  })();
</script>
