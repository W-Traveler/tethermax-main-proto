<script>
  const EN = new URLSearchParams(location.search).get('lang') === 'en';
  const hv = (k) => (location.hash.match(new RegExp('[#&]' + k + '=([\\w.]+)')) || [])[1];
  // 영문 보기: 키 = 화면 국문
  const DICT = {
    '검색': 'Search', '프리로그인 랜딩 페이지': 'Pre-login landing page', '메인 관리': 'Main page', '웹 메인 배너 관리': 'Web main banners', '신규': 'New', '회원관리': 'Members', '페이백': 'Cashback', '거래소': 'Exchanges', '거래소 리뷰': 'Exchange reviews', '이벤트': 'Events', '공지': 'Notices', '푸시': 'Push', '엑셀': 'Excel', '쿠폰': 'Coupons',
    '1024px 이상 웹 메인 맨 위 왼쪽 칸에 노출. 저장하면 바로 반영되고, 노출 기간 설정은 없습니다.': 'Shown in the top-left slot of the web main page (1024px and up). Changes go live on save. No display period setting.',
    '배너 추가': 'Add banner', '선택 항목 삭제': 'Delete selected', '취소': 'Cancel', '저장': 'Save', '적용': 'Apply',
    '적용한 내용은 목록 [저장]을 눌러야 웹 메인에 반영돼요': 'Applied changes go live after you [Save] the list',
    '저장하지 않은 변경을 버릴까요?': 'Discard unsaved changes?', '마지막으로 저장한 상태로 돌아갑니다.': 'Goes back to the last saved state.', '계속 편집': 'Keep editing', '버리기': 'Discard',
  };
  const L = (ko, en) => (EN ? en : ko);
  if (EN) { document.documentElement.lang = 'en'; document.querySelectorAll('[data-k]').forEach((el) => { if (DICT[el.dataset.k]) el.textContent = DICT[el.dataset.k]; }); }

  // 관리 언어 15개 (현행 어드민과 같은 순서). 한국어 · 영어 필수, 나머지는 비우면 영어로 표시 (11.03)
  const LANGS = [
    ['ko', '한국어', 'Korean'], ['en', '영어', 'English'], ['zhCN', '중국어 (간체)', 'Chinese (Simplified)'], ['zhTW', '중국어 (번체)', 'Chinese (Traditional)'],
    ['mn', '몽골어', 'Mongolian'], ['ru', '러시아어', 'Russian'], ['tr', '터키어', 'Turkish'], ['pt', '포르투갈어', 'Portuguese'], ['vi', '베트남어', 'Vietnamese'],
    ['id', '인도네시아어', 'Indonesian'], ['es', '스페인어', 'Spanish'], ['ja', '일본어', 'Japanese'], ['ar', '아랍어', 'Arabic'], ['fr', '프랑스어', 'French'], ['uz', '우즈벡어', 'Uzbek'],
  ];
  const REQ = ['ko', 'en'];
  const langName = (c) => { const l = LANGS.find((x) => x[0] === c); return l ? L(l[1], l[2]) : c; };
  // 링크 페이지 목록 (미결 #7 가안)
  const PAGES = [['dex', 'DEX 거래소 목록', 'DEX exchange list'], ['boost', '페이백 부스트 안내', 'Cashback Boost'], ['hub', 'Cashback Hub', 'Cashback Hub'], ['calc', '페이백 계산기', 'Cashback calculator'], ['event', '이벤트 상세', 'Event detail']];
  const pageName = (v) => { const p = PAGES.find((x) => x[0] === v); return p ? L(p[1], p[2]) : ''; };
  const tx = (o) => Object.fromEntries(LANGS.map(([c]) => [c, o[c] || '']));
  const ex = (img, t, s, page, at) => ({ img, t: tx(t), s: tx(s), lt: 'page', page, url: '', at });
  // 예시 데이터: 첫 등록 콘텐츠(REQ-A-013) + 두 번째부터는 예시. 번역 문구는 자리표시
  const SEED = {

    if (t.closest('[data-bo-edit-open]')) { openEdit(itemOf(t)); return; }
    if (t.closest('[data-bo-lang]')) { goLang(t.closest('[data-bo-lang]').dataset.boLang); return; }
    if (t.closest('[data-bo-lang-prev]')) { goLang(LANGS[Math.max(0, langIdx() - 1)][0]); return; }
    if (t.closest('[data-bo-lang-next]')) { goLang(LANGS[Math.min(LANGS.length - 1, langIdx() + 1)][0]); return; }
    if (t.closest('[data-bo-pick]')) { $('[data-bo-file]').click(); return; }
    if (t.closest('[data-bo-apply]')) { apply(); return; }
    if (t.closest('[data-bo-edit-cancel]') || t.closest('[data-bo-x]') || t.matches('[data-bo-edit-wrap]')) { cancelEdit(); return; }
    if (t.closest('[data-bo-save]')) { save(); return; }
    if (t.closest('[data-bo-cancel]')) {
      if (!isDirty(tab)) { toast(L('바뀐 내용이 없어요', 'Nothing changed')); return; }
      $('[data-bo-confirm-wrap]').hidden = false; $('[data-bo-keep]').focus(); return;
    }
    if (t.closest('[data-bo-keep]') || t.matches('[data-bo-confirm-wrap]')) { $('[data-bo-confirm-wrap]').hidden = true; return; }
    if (t.closest('[data-bo-discard]')) {
      $('[data-bo-confirm-wrap]').hidden = true;
      draft[tab] = clone(saved[tab]); sel[tab].clear(); paint();
      toast(L('저장하지 않은 변경을 버렸어요', 'Discarded unsaved changes'));
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { if (!$('[data-bo-confirm-wrap]').hidden) $('[data-bo-confirm-wrap]').hidden = true; else if (ed) cancelEdit(); return; }
    if (e.key === 'Enter' && ed && e.target.matches('[data-tf]')) { e.preventDefault(); if (e.target.dataset.tf === 't') { const s = $('[data-bo-edit] [data-tf="s"]'); if (s) s.focus(); } else if (langIdx() < LANGS.length - 1) goLang(LANGS[langIdx() + 1][0]); }
  });
  document.addEventListener('input', (e) => {
    const t = e.target; if (!ed || !t.matches('[data-tf]')) return;
    ed.x[t.dataset.tf][ed.lang] = t.value;
    delete ed.errs[t.dataset.tf + ':' + ed.lang];
    // 언어 목록의 입력 상태만 다시 그림 (입력 칸은 그대로 두어 초점 유지)
    const b = $(`[data-bo-lang="${ed.lang}"]`);
    if (b) { const has = String(ed.x.t[ed.lang] || '').trim(); b.querySelector('.dot').style.background = has ? '#4ADE80' : '#3F3F46'; const st = b.querySelector('.st'); st.className = 'st ' + (has ? 'text-[#86EFAC]' : REQ.includes(ed.lang) ? 'text-[#FDE047]' : 'text-faint'); st.textContent = has ? L('입력됨', 'Filled') : REQ.includes(ed.lang) ? L('필수', 'Required') : L('영어 표시', 'English'); }
    const fl = $('[data-bo-fill]'); if (fl) fl.textContent = `${L('언어', 'Languages')} ${filled(ed.x)} / ${LANGS.length} ${L('입력', 'filled')}`;
  });
  document.addEventListener('change', (e) => {
    const t = e.target;
    if (t.matches('[data-bo-check]')) { const x = draft[tab][itemOf(t)]; if (t.checked) sel[tab].add(key(x)); else sel[tab].delete(key(x)); paint(); return; }
    if (t.matches('[data-bo-file]')) { const f = t.files && t.files[0]; if (f && ed) { ed.x.img = URL.createObjectURL(f); delete ed.errs.img; paintEdit(); } t.value = ''; return; }
    if (ed && t.matches('[data-ef]')) {
      const k = t.dataset.ef;
      if (k === 'lt') { ed.x.lt = t.value; if (ed.x.lt === 'page') ed.x.url = ''; else ed.x.page = ''; delete ed.errs.page; delete ed.errs.url; paintEdit(); return; }
      ed.x[k] = t.value.trim(); delete ed.errs[k]; paintEdit();
    }
  });
  // 끌어서 순서 변경 (REQ-A-006). 키보드 · 정확한 이동은 ↑ ↓ 버튼
  let dragFrom = -1;
  document.addEventListener('dragstart', (e) => { const tr = e.target.closest && e.target.closest('[data-bo-item]'); if (!tr) return; dragFrom = +tr.dataset.boItem - 1; tr.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  document.addEventListener('dragover', (e) => { const tr = e.target.closest && e.target.closest('[data-bo-item]'); if (dragFrom < 0 || !tr) return; e.preventDefault(); document.querySelectorAll('.drop-above').forEach((r) => r.classList.remove('drop-above')); tr.classList.add('drop-above'); });
  document.addEventListener('drop', (e) => {
    const tr = e.target.closest && e.target.closest('[data-bo-item]'); if (dragFrom < 0 || !tr) return; e.preventDefault();
    const to = +tr.dataset.boItem - 1, list = draft[tab]; const [x] = list.splice(dragFrom, 1); list.splice(to, 0, x); dragFrom = -1; paint();
  });
  document.addEventListener('dragend', () => { dragFrom = -1; document.querySelectorAll('.dragging, .drop-above').forEach((r) => r.classList.remove('dragging', 'drop-above')); });

  // REQ-A-010 저장: 목록 전체(순서 · 삭제 · 수정)를 한 번에
  function save() {
    const list = draft[tab];
    const bad = list.findIndex((x) => Object.keys(validate(x)).length);
    if (bad >= 0) { openEdit(bad); apply(); return; }
    const at = nowUtc();
    list.forEach((x) => { if (x._new || x._chg) x.at = at; delete x._new; delete x._chg; });
    saved[tab] = clone(list);
    hist[tab] = [at + ' (UTC)', 'eon'];
    sel[tab].clear(); paint();
    toast(L('저장했어요. 웹 메인에 바로 반영돼요', 'Saved. Live on the web main page now'));
    if (window.devLog) window.devLog('api', `웹 메인 배너 저장 (${tab === 'linked' ? '연동용' : '미연동용'} ${list.length}개, 목록 전체 · 캐시 무효화 NFR-A-001)`);
  }
  paint();
  icons();
</script>

<!-- [DEV] 개발 확인용 브리지 (proto.html과 같은 방식): 셸의 조작(tm:steps) · 번호 표시(tm:marks)를 받는다 -->
<script>
  (() => {
    const inShell = window.self !== window.top;
    const post = (msg) => { if (inShell) { try { parent.postMessage(msg, '*'); } catch (e) { /* 무시 */ } } };
    window.devLog = (kind, msg) => post({ type: 'tm:log', kind, msg });
    const visible = (sel) => [...document.querySelectorAll(sel)].find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden');
    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    async function run(steps) {
      for (const sp of steps || []) {
        if (sp.wait) await wait(sp.wait);
        if (sp.click) { const el = visible(sp.click); if (el) el.click(); else window.devLog('warn', `조작 대상을 못 찾음: ${sp.click}`); await wait(sp.after || 120); }
        if (sp.hl) { await wait(60); const el = visible(sp.hl); if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' }); }
      }
      post({ type: 'tm:stepsDone' });
    }
    const layer = document.createElement('div');
    layer.setAttribute('aria-hidden', 'true');
    layer.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:2147483000';
    document.body.appendChild(layer);
    let marks = [], showMarks = true, focusN = 0, lastVis = null, layerWas = null;
    const mst = document.createElement('style');
    mst.textContent = `
      .dev-mk{position:fixed;border:1.5px dashed #E5317A;border-radius:8px;box-sizing:border-box;transition:background-color .2s}
      .dev-mk.on{background:rgba(229,49,122,.08);border-style:solid;border-width:2px}
      .dev-mk b{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:#E5317A;color:#fff;font:700 12px/22px system-ui,sans-serif;text-align:center;pointer-events:auto;cursor:pointer;box-shadow:0 0 0 2px #fff,0 2px 6px rgba(0,0,0,.25)}
      .dev-mk.on b{transform:scale(1.15)}`;
    document.head.appendChild(mst);
    const resolve = (spec) => { const [sel, up] = spec.split(' ^'); let el = visible(sel.trim()); for (let i = 0; el && i < (+up || 0); i += 1) el = el.parentElement; return el; };
    const openLayer = () => [...document.querySelectorAll('[aria-modal="true"]')].reverse().find((el) => el.getClientRects().length && getComputedStyle(el).visibility !== 'hidden') || null;
    function drawMarks() {
      layer.style.display = showMarks ? '' : 'none';
      const top = openLayer();
      if (!!top !== layerWas) { layerWas = !!top; post({ type: 'tm:layer', open: layerWas }); }
      while (layer.children.length < marks.length) {
        const d = document.createElement('div'); d.className = 'dev-mk'; d.innerHTML = '<b></b>';
        d.firstChild.addEventListener('click', () => post({ type: 'tm:markClick', n: +d.dataset.n }));
        layer.appendChild(d);
      }
      const placed = [];
      [...layer.children].forEach((d, i) => {
        const m = marks[i]; const el = m && resolve(m.sel);
        const r = el && (!top || top.contains(el)) && el.getBoundingClientRect();
        if (!r || (!r.width && !r.height)) { d.style.display = 'none'; return; }
        d.style.display = ''; d.dataset.n = m.n; d.firstChild.textContent = m.n;
        d.classList.toggle('on', focusN === m.n);
        d.style.left = (r.left - 3) + 'px'; d.style.top = (r.top - 3) + 'px';
        d.style.width = (r.width + 6) + 'px'; d.style.height = (r.height + 6) + 'px';
        let bx = r.left - 14; const by = r.top - 14;
        while (placed.some((p) => Math.abs(p.bx - bx) < 24 && Math.abs(p.by - by) < 24)) bx += 26;
        d.firstChild.style.left = (bx - (r.left - 3)) + 'px'; d.firstChild.style.top = '-11px';
        placed.push({ bx, by });
      });
      const vis = [...layer.children].filter((d) => d.style.display !== 'none' && d.dataset.n).map((d) => +d.dataset.n).filter((x) => marks.some((m) => m.n === x));
      const sig = vis.join(','); if (sig !== lastVis) { lastVis = sig; post({ type: 'tm:markVis', vis }); }
    }
    setInterval(drawMarks, 250);
    let raf = 0;
    window.addEventListener('scroll', () => { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawMarks); }, { capture: true, passive: true });
    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === 'tm:steps') run(d.steps);
      if (d.type === 'tm:marks') { marks = d.list || []; showMarks = d.show !== false; drawMarks(); }
      if (d.type === 'tm:markShow') { showMarks = !!d.show; drawMarks(); }
      if (d.type === 'tm:markGo') {
        const m = marks.find((x) => x.n === d.n); const el = m && resolve(m.sel);
        focusN = d.n;
        if (el) el.scrollIntoView({ block: 'center', inline: 'nearest' });
        drawMarks(); setTimeout(() => { if (focusN === d.n) { focusN = 0; drawMarks(); } }, 2400);
      }
    });
    const ready = () => post({ type: 'tm:ready', env: { device: 'off', osPrompt: 'yes' } });
    if (document.readyState === 'complete') setTimeout(ready, 60); else window.addEventListener('load', () => setTimeout(ready, 60), { once: true });
  })();
</script>
