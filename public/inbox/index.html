<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paybacks 앱 알림함 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Wanted Sans";src:url("/fonts/WantedSansVariable.woff2") format("woff2");font-weight:400 900;font-display:swap}
:root{
  --bar:#151a24; --bar-2:#1d2330; --bar-line:#2c3443; --bar-text:#e8ebf1; --bar-dim:#8f98a8;
  --canvas:#e6e8ec; --mk:#e2367a; --case:#6d4aff;
  --pb:#6d4aff; --pb-soft:#f1edff; --pb-page:#f8f8fa;
  --t1:rgba(0,0,0,.87); --t2:rgba(0,0,0,.6); --t3:rgba(0,0,0,.38); --line:rgba(0,0,0,.08);
  --font-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-pb:"Wanted Sans","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ko);font-size:14px;color:#111;background:var(--canvas);overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ---------- 상단 컨트롤 패널 ---------- */
.top{background:var(--bar);color:var(--bar-text)}
.row1{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.row1 h1{font-size:15px;font-weight:700}
.r1-right{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--bar-2);border:1px solid var(--bar-line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--bar-dim);font-size:12px;font-weight:600;padding:5px 9px;border-radius:5px;white-space:nowrap}
.seg button.on{background:#fff;color:#111}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--bar-text);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--case)}
.pbtn{display:flex;align-items:center;gap:6px;background:#fff;color:#111;border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.pbtn .cnt{min-width:18px;height:18px;border-radius:9px;background:var(--mk);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.row2{min-height:42px;display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--bar-line);background:var(--bar-2);flex-wrap:wrap}
.lbl{font-size:12px;color:var(--bar-dim);margin:0 2px 0 4px}
.nav{width:28px;height:30px;border-radius:7px;border:1px solid var(--bar-line);background:#0e121a;color:var(--bar-text);font-size:15px}
.sel{height:32px;background:#0e121a;color:var(--bar-text);border:1px solid var(--bar-line);border-radius:8px;padding:0 10px;font-size:13px;min-width:230px;font-family:inherit}
.cases{display:flex;gap:6px;flex-wrap:wrap}
.case{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-dim);font-size:13px;white-space:nowrap}
.case code{font-family:var(--font-mono);font-size:10.5px;background:rgba(255,255,255,.08);padding:2px 5px;border-radius:4px}
.case.on{background:var(--case);border-color:var(--case);color:#fff}
.case.on code{background:rgba(255,255,255,.2)}
.vsep{width:1px;height:20px;background:var(--bar-line);margin:0 2px}
.reset{height:30px;border:0;border-radius:8px;background:#fff;color:#111;font-size:13px;font-weight:600;padding:0 10px}

/* ---------- 본문 · 설명 패널 ---------- */
.main{display:flex;height:calc(100vh - var(--toph,88px))}
.canvas{flex:1;overflow:auto;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.stage{transform-origin:top center}
.status{position:fixed;left:10px;bottom:10px;background:#2b313d;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;z-index:5}
.panel{width:350px;flex:none;background:#fff;border-left:1px solid #d9dce3;overflow:auto;display:flex;flex-direction:column}
.panel.off{display:none}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.p-head b{font-size:14px}
.p-head small{font-size:12px;color:#888;margin-left:6px;font-weight:400}
.p-x{border:0;background:transparent;font-size:18px;color:#666}
.p-body{padding:0 14px 14px;flex:1}
.p-id{display:inline-block;font-family:var(--font-mono);font-size:11px;background:#eef0f4;color:#444;padding:3px 6px;border-radius:4px;margin:6px 0 10px}
.p-title{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.4}
.plb{font-weight:600;color:#111827;margin-right:2px}
.p-list{padding-left:16px;margin-bottom:12px}
.p-list li{font-size:13px;line-height:1.55;margin-bottom:4px;color:#222}
.p-item{margin-bottom:10px;cursor:pointer;border-radius:8px;padding:4px 4px 2px;margin-left:-4px}
.p-item:hover{background:#f6f7f9}
.p-item h4{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:4px}
.p-item h4 .n{position:static}
.p-item ul{padding-left:30px}
.p-item li{font-size:12.5px;line-height:1.55;color:#333;margin-bottom:2px}
.p-foot{border-top:1px solid #eee;padding:12px 14px;font-size:12px;color:#777;line-height:1.55}
.p-foot a{color:#5b3fe0}

/* 설명 번호 */
.n{width:22px;height:22px;border-radius:50%;background:var(--mk);color:#fff;font:700 11px/22px var(--font-ko);text-align:center;flex:none}
.mk{position:relative}
.mk>.n{position:absolute;left:-9px;top:-9px;z-index:30;width:18px;height:18px;font-size:10px;line-height:18px;display:none}
body.show-mk .mk{outline:1px dashed var(--mk);outline-offset:2px}
body.show-mk .mk>.n{display:block}
.mk.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(226,54,122,0)}50%{box-shadow:0 0 0 6px rgba(226,54,122,.35)}}

/* ---------- 폰 ---------- */
.phone{width:391px;height:828px;border:8px solid #111;border-radius:48px;background:#111;position:relative;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.scr{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:var(--pb-page);font-family:var(--font-pb);color:var(--t1)}
.sbar{position:absolute;left:0;right:0;top:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 26px 0 34px;font:600 15px/1 -apple-system,"Inter",sans-serif;color:#000;z-index:80;pointer-events:none}
.sbar .ic{display:flex;gap:5px;align-items:center}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:81}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:81}
.view{position:absolute;inset:47px 0 0 0;display:flex;flex-direction:column}

/* 홈 (웹뷰) */
.pbhome{position:relative;height:100%;background:#f8f8fa;overflow:hidden}
.pbhome>img{display:block;width:375px}
.bellhit{position:absolute;left:248px;top:12px;width:30px;height:32px;border-radius:8px;z-index:5;cursor:pointer}
.reddot{position:absolute;left:265px;top:16px;width:8px;height:8px;border-radius:50%;background:#ff3b30;box-shadow:0 0 0 1.5px #fff;z-index:6}
/* 하단 탭바 (Figma 탭바 02 · 상단 라운드, 상단 패딩 조정본) */
.tabbar{position:absolute;left:0;right:0;bottom:0;height:84px;background:#fff;border:1px solid rgba(0,0,0,.118);border-bottom:0;border-radius:16px 16px 0 0;z-index:10}
.tabbar .row{display:flex;height:60px}
.tabbar .tb{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;padding-top:14px;gap:4px;font:500 12px/18px var(--font-pb);color:rgba(0,0,0,.6)}
.tabbar .tb.on{color:var(--pb)}
.tabbar .tb.on::before{content:"";position:absolute;left:50%;top:11px;transform:translateX(-50%);width:72px;height:52px;border-radius:16px;background:var(--pb-soft);z-index:-1}
.tabbar svg{width:24px;height:24px;display:block}

/* 알림함 (네이티브) */
.ihead{height:56px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px 0 16px;background:var(--pb-page)}
.ihead .l{display:flex;align-items:center;gap:8px}
.ibtn{width:40px;height:40px;border:0;background:transparent;border-radius:20px;display:flex;align-items:center;justify-content:center;color:var(--t1)}
.ibtn svg{width:24px;height:24px}
.ihead .l .ibtn{margin-left:-8px}
.ihead h2{font:500 20px/32px var(--font-pb);color:var(--t1)}
.banner{margin:4px 16px 12px;background:var(--pb-soft);border-radius:8px;padding:12px 12px 12px 14px;display:flex;gap:10px;align-items:center}
.banner .bi{width:36px;height:36px;border-radius:18px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--pb);flex:none}
.banner .bi svg{width:20px;height:20px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font:600 14px/20px var(--font-pb);color:var(--t1)}
.banner .bt span{display:block;font:400 13px/18px var(--font-pb);color:var(--t2)}
.banner .bon{height:32px;padding:0 12px;border:0;border-radius:4px;background:var(--pb);color:#fff;font:600 13px/1 var(--font-pb);flex:none}
.banner .bx{width:28px;height:28px;border:0;background:transparent;color:var(--t3);display:flex;align-items:center;justify-content:center;flex:none;margin-right:-4px}
.banner .bx svg{width:18px;height:18px}
.list{flex:1;overflow:auto;padding:4px 16px 24px}
.list::-webkit-scrollbar{display:none}
.grp{margin-top:12px;background:#fff;border-radius:8px;box-shadow:0 4px 10px rgba(0,0,0,.06);overflow:hidden}
.it{display:flex;gap:12px;padding:14px 16px;cursor:pointer;position:relative}
.it+.it{border-top:1px solid var(--line)}
.it:active{background:#fafafa}
.it.un{background:#faf8ff}
.ib{flex:1;min-width:0}
.it .tt{display:flex;align-items:center;gap:8px}
.it .tt b{flex:1;min-width:0;font:500 15px/22px var(--font-pb);color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it.un .tt b{font-weight:600;color:var(--t1)}
.it .tm{font:400 12px/18px var(--font-pb);color:var(--t3);margin-top:6px}
.it .ud{width:6px;height:6px;border-radius:3px;background:var(--pb);flex:none}
.it .bd{font:400 14px/20px var(--font-pb);color:var(--t2);margin-top:2px;white-space:pre-line}
.it.un .bd{color:rgba(0,0,0,.72)}
/* 로딩 */
.sk{background:linear-gradient(90deg,#eceef2 25%,#f6f7f9 50%,#eceef2 75%);background-size:300% 100%;animation:sk 1.4s ease infinite;border-radius:6px}
@keyframes sk{from{background-position:100% 0}to{background-position:0 0}}
/* 빈 상태 · 오류 */
.blank{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-bottom:80px;color:var(--t2);font:400 15px/22px var(--font-pb);text-align:center}
.blank .bic{width:56px;height:56px;border-radius:28px;background:#eef0f3;display:flex;align-items:center;justify-content:center;color:var(--t3)}
.blank .bic svg{width:28px;height:28px}
.obtn{height:36px;padding:0 16px;border:1px solid rgba(109,74,255,.5);border-radius:4px;background:#fff;color:var(--pb);font:500 14px/1 var(--font-pb)}
.more{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 0 6px;font:400 13px/18px var(--font-pb);color:var(--t2)}

/* 토스트 (Paybacks 앱 Toast) */
.toast{position:absolute;left:16px;right:16px;bottom:34px;background:#1c1c1e;color:#fff;border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:16px;font:400 13px/23.4px var(--font-pb);letter-spacing:-.01em;z-index:70;overflow:hidden;
  box-shadow:0 8px 10px rgba(0,0,0,.2),0 6px 30px rgba(0,0,0,.12),0 16px 24px rgba(0,0,0,.14)}
.toast .ti{width:32px;height:32px;border-radius:43px;background:#303746;display:flex;align-items:center;justify-content:center;flex:none;position:relative;z-index:1}
.toast .glow{position:absolute;left:-74px;top:-65px;width:212px;height:212px;border-radius:50%;background:radial-gradient(circle,rgba(0,237,82,.12) 0%,rgba(0,237,122,0) 70%);pointer-events:none}
.toast span{position:relative;z-index:1}
.ttoast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#2b313d;color:#fff;font:500 12px/1.4 var(--font-ko);padding:8px 12px;border-radius:8px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:330px;text-align:center}
.ttoast.on{opacity:1}

/* OS 알림 허용 창 */
.osdim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:60;display:flex;align-items:center;justify-content:center}
.ios{width:272px;background:rgba(242,242,247,.98);border-radius:14px;text-align:center;font-family:-apple-system,"Inter","Noto Sans KR",sans-serif;color:#000}
.ios .t{padding:18px 16px 4px;font-weight:600;font-size:16px;line-height:1.3}
.ios .d{padding:0 16px 16px;font-size:13px;line-height:1.4}
.ios .b{display:flex;border-top:1px solid #c8c8cc}
.ios .b>div{flex:1;display:flex}
.ios .b>div+div{border-left:1px solid #c8c8cc}
.ios .b button{flex:1;height:44px;border:0;background:transparent;font-size:16px;color:#0a7aff}
.ios .b>div+div button{font-weight:600}
.adlg{width:300px;background:#eef1f8;border-radius:28px;padding:24px 24px 16px;font-family:Roboto,"Noto Sans KR",sans-serif;color:#1a1c1e;text-align:center}
.adlg .ic{display:flex;justify-content:center;margin-bottom:16px}
.adlg .t{font-size:20px;line-height:1.35;margin-bottom:20px}
.adlg .b{display:flex;flex-direction:column;gap:8px}
.adlg .b button{width:100%;height:44px;border:0;border-radius:22px;background:#d8e2ff;color:#001a41;font-size:15px;font-weight:500}

/* 기기 설정 앱 (시스템 화면 예시) */
.setapp{position:absolute;inset:0;background:#f2f2f7;z-index:65;font-family:-apple-system,"Inter","Noto Sans KR",sans-serif;color:#000;padding-top:47px}
.setapp .nb{height:44px;display:flex;align-items:center;padding:0 8px;color:#0a7aff;font-size:17px}
.setapp h3{font-size:30px;font-weight:700;padding:4px 16px 18px}
.setapp .grp2{margin:0 16px;background:#fff;border-radius:10px}
.setapp .rw{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:17px}
.sw{width:51px;height:31px;border-radius:16px;background:#e9e9eb;position:relative;cursor:pointer;border:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:left .2s}
.sw.on{background:#34c759}.sw.on::after{left:22px}
.setapp .cap{font-size:13px;color:#6d6d72;padding:8px 32px}
.setapp .back{position:absolute;left:16px;right:16px;bottom:40px;height:48px;border:0;border-radius:12px;background:#111;color:#fff;font:600 15px/1 var(--font-ko)}
.syslbl{position:absolute;left:50%;top:56px;transform:translateX(-50%);background:#ffe8a3;color:#5a4300;font:600 11px/1 var(--font-ko);padding:5px 8px;border-radius:5px;z-index:66;white-space:nowrap}

/* 푸시 배너 (홈 위) */
.push{position:absolute;left:12px;right:12px;top:52px;background:rgba(246,246,248,.86);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:24px;padding:13px 14px;display:flex;gap:11px;align-items:flex-start;box-shadow:0 12px 32px -12px rgba(15,23,60,.28);z-index:50;cursor:pointer;font-family:-apple-system,"Inter","Noto Sans KR",sans-serif}
.push img{width:38px;height:38px;border-radius:9px;flex:none;margin-top:2px}
.push .px{flex:1;min-width:0}
.push .ph{display:flex;justify-content:space-between;font-size:15px;font-weight:600;line-height:19.5px}
.push .ph span{font-size:13px;font-weight:400;color:rgba(60,60,67,.6)}
.push .pb{font-size:15px;line-height:20px}

/* 알림 설정 (네이티브 · 디자인 파일 02 My Page 앱 Notification Settings 기준) */
.shead{height:50px;flex:none;display:flex;align-items:center;padding:16px 16px 0}
.shead .ibtn{width:34px;height:34px;margin-left:-5px}
.stitle{font:600 14px/20px var(--font-pb);color:var(--t1);padding:16px 16px 16px}
.sgrp{margin:0 16px 16px;background:#fff;border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.05);padding:8px 16px}
.srow{display:flex;align-items:center;gap:24px;min-height:40px;padding:8px 0}
.srow span{flex:1;font:500 14px/20px var(--font-pb);color:var(--t1)}
.srow small{display:block;font:400 12px/18px var(--font-pb);color:var(--t2);margin-top:2px}
.tg{width:40px;height:24px;border-radius:12px;background:#c9cbd1;border:0;position:relative;flex:none;cursor:pointer;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.tg.on{background:var(--pb)}.tg.on::after{left:19px}
.sbanner{margin:0 16px 16px}
.sbanner .banner{margin:0}
.dlgdim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:0 16px}
.dlg{width:100%;background:#fff;border-radius:4px;box-shadow:0 8px 10px rgba(0,0,0,.2),0 16px 24px rgba(0,0,0,.14),0 6px 30px rgba(0,0,0,.12)}
.dlg h3{font:500 20px/32px var(--font-pb);color:var(--t1);padding:24px 24px 0}
.dlg p{font:500 14px/20px var(--font-pb);color:var(--t2);padding:8px 24px 0}
.dlg ul{padding:8px 24px 0 42px;font:400 14px/22px var(--font-pb);color:var(--t2)}
.dlg ul a{color:var(--t2);text-decoration:underline}
.dlg .act{display:flex;gap:8px;padding:24px}
.dlg .act button{flex:1;height:42px;border:0;border-radius:4px;font:500 15px/1 var(--font-pb)}
.dlg .act .c{background:#f2f2f5;color:var(--t1)}.dlg .act .p{background:var(--pb);color:#fff}

</style>
</head>
<body>

<div class="top" id="top">
  <div class="row1">
    <h1>Paybacks 앱 알림함 · 프로토타입</h1>
    <div class="r1-right">
      <div class="seg" id="langSeg"><button data-v="en" class="on">EN</button><button data-v="ko">KO</button></div>
      <label class="chk"><input type="checkbox" id="mkChk"> 설명 번호</label>
      <button class="pbtn" id="panelBtn">화면 설명 <span class="cnt" id="cnt">0</span></button>
    </div>
  </div>
  <div class="row2">
    <span class="lbl">화면</span>
    <button class="nav" id="prevS">‹</button>
    <select class="sel" id="sel"></select>
    <button class="nav" id="nextS">›</button>
    <div class="cases" id="cases"></div>
    <span class="vsep"></span>
    <span class="lbl">[켜기] 결과</span>
    <div class="seg" id="osSeg"><button data-v="ios" class="on">iOS OS 창</button><button data-v="android">Android OS 창</button><button data-v="settings">설정 앱 (OS 창 불가)</button></div>
    <span class="vsep"></span>
    <span class="lbl">보기</span>
    <div class="seg" id="zoomSeg"><button data-v="fit" class="on">창에 맞춤</button><button data-v="100">100%</button></div>
    <button class="reset" id="resetBtn">↻ 처음부터</button>
  </div>
</div>

<div class="main" id="main">
  <div class="canvas" id="canvas">
    <div class="stage" id="stage">
      <div class="phone"><div class="scr" id="scr"></div></div>
    </div>

let lang="en", sIdx=0, cIdx=0, zoom="fit", osMode="ios";

function tabbar(){ const k=["home","ex","ev","bn"]; return `<div class="tabbar"><div class="row">${k.map((x,i)=>`<div class="tb${i===0?' on':''}">${TABI[x]}<span>${t('tabs')[i]}</span></div>`).join('')}</div></div>`; }
function home(dot,mn){ // mn: 설명 번호
  const inner=`<div class="bellhit" data-go="NI-M02-a" style="left:0;top:0" title="알림함"></div>${dot?'<div class="reddot" style="left:17px;top:4px"></div>':''}`;
  const st='position:absolute;left:248px;top:12px;width:30px;height:32px;z-index:6';
  return `<div class="view"><div class="pbhome"><img src="../onboarding/pb_home.webp" alt="">${mn?mk(mn,inner,st):`<div style="${st}">${inner}</div>`}${tabbar()}</div></div>`;
}
function header(m){ const bk=`<button class="ibtn" data-go="back">${I.back}</button>`, st=`<button class="ibtn" data-go="settingsPage">${I.gear}</button>`;
  return `<div class="ihead"><div class="l">${m?mk(m[0],bk):bk}<h2>${t('title')}</h2></div>${m?mk(m[1],st):st}</div>`; }
function banner(m){ const xb=`<button class="bx" data-go="NI-M03-h" aria-label="close">${I.x}</button>`;
  const b=`<div class="banner"><div class="bi">${I.belloff}</div><div class="bt"><b>${t('bnT')}</b><span>${t('bnB')}</span></div><button class="bon" data-go="turnon">${t('bnOn')}</button>${m?mk(m+1,xb,'display:flex'):xb}</div>`;
  return m?mk(m,b):b; }
function row(it,mn){ const un=it.un&&!readSet.has(it.id); const L=it[lang];
  const h=`<div class="it${un?' un':''}" data-item="${it.id}"><div class="ib"><div class="tt"><b>${L[0]}</b>${un?'<i class="ud"></i>':''}</div><div class="bd">${L[1]}</div><div class="tm">${it.at}</div></div></div>`;
  return mn?mk(mn,h,'display:block'):h; }
function list(opt={}){ // opt.mark {itemId:n}, opt.moreErr
  const its=ITEMS;
  let h=`<div class="grp">${its.map(x=>row(x,opt.mark&&opt.mark[x.id])).join('')}</div>`;
  if(opt.moreErr){ const m=`<div class="more"><span>${t('moreErr')}</span><button class="obtn" data-go="NI-M02-a">${t('retry')}</button></div>`; h+=opt.moreMk?mk(opt.moreMk,m):m; }
  return `<div class="list" id="ilist">${h}</div>`; }
function skeleton(){ const r=()=>`<div style="display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line)"><div style="flex:1"><div class="sk" style="height:14px;width:60%;margin:4px 0 10px"></div><div class="sk" style="height:12px;width:92%;margin-bottom:6px"></div><div class="sk" style="height:12px;width:70%;margin-bottom:10px"></div><div class="sk" style="height:10px;width:30%"></div></div></div>`;
  return `<div class="list"><div class="grp">${[1,2,3,4].map(r).join('').replace('border-top:1px solid var(--line)','')}</div></div>`; }
function blank(icon,msg,btn){ return `<div class="blank"><div class="bic">${icon}</div><div>${msg}</div>${btn||''}</div>`; }
function toast(key,ok,mn){ const h=`<div class="toast">${ok?`<div class="glow"></div><div class="ti">${I.check}</div>`:''}<span>${t(key)}</span></div>`;
  return mn?mk(mn,h,'position:absolute;left:0;right:0;bottom:0;z-index:70'):h; }
function inbox(o={}){ // o: banner, body('list'|'loading'|'empty'|'error'|'moreErr'), mark, toast, hm(header marks) bm(banner mark)
  let body;
  if(o.body==='loading') body=mk(o.lm||1,skeleton(),'flex:1;display:flex;flex-direction:column');
  else if(o.body==='empty') body=mk(1,blank(I.bell,t('eAll')),'flex:1;display:flex;flex-direction:column');
  else if(o.body==='error') body=mk(1,blank(I.alert,t('err'),`<button class="obtn" data-go="NI-M02-a">${t('retry')}</button>`),'flex:1;display:flex;flex-direction:column');
  else body=list({mark:o.mark,moreErr:o.body==='moreErr',moreMk:1});
  return `<div class="view">${header(o.hm)}${o.banner?banner(o.bm):''}${body}</div>${o.toast?toast(o.toast[0],o.toast[1],o.toast[2]):''}`;
}
function iosAlert(){ const no=`<button data-go="NI-M03-e">${t('iosNo')}</button>`, yes=`<button data-go="NI-M03-d">${t('iosYes')}</button>`;
  return `<div class="ios"><div class="t">${t('iosT')}</div><div class="d">${t('iosD')}</div><div class="b"><div>${mk(2,no,'flex:1;display:flex')}</div><div>${mk(1,yes,'flex:1;display:flex')}</div></div></div>`; }
function androidAlert(){ const bell=`<svg width="24" height="24" viewBox="0 0 24 24" fill="#3a5f9e"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6V11c0-3.07-1.64-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>`;
  return `<div class="adlg"><div class="ic">${bell}</div><div class="t">${t('anT')}</div><div class="b">${mk(1,`<button data-go="NI-M03-d">${t('anYes')}</button>`,'display:flex')}${mk(2,`<button data-go="NI-M03-e">${t('anNo')}</button>`,'display:flex')}</div></div>`; }
function bgInbox(){ noMk=true; const h=bgCtx==="settings"?settings({off:true}):inbox({banner:true}); noMk=false; return h; }
function tg(k,on,m){ const b=`<button class="tg${on?' on':''}" data-tg="${k}" aria-label="${k}"></button>`; return m?mk(m,b,'display:flex'):b; }
function settings(o={}){ // o.off 기기 알림 꺼짐, o.dlg 'ess'|'mkt'|'consent', o.toast, o.m 설명 번호
  const m=o.m||{};
  const bn=o.off?`<div class="sbanner">${(()=>{ const b=`<div class="banner"><div class="bi">${I.belloff}</div><div class="bt"><b>${t('bnT')}</b><span>${t('sbB')}</span></div><button class="bon" data-go="turnon">${t('bnOn')}</button></div>`; return m.bn?mk(m.bn,b):b; })()}</div>`:'';
  const row=(k,l,d)=>`<div class="srow"><span>${t(l)}${d?`<small>${t(d)}</small>`:''}</span>${tg(k,sst[k],m[k])}</div>`;
  let dlg='';
  if(o.dlg==='ess'||o.dlg==='mkt'){ const T=o.dlg==='ess'?['dEssT','dEssB']:['dMktT','dMktB'];
    const d=`<div class="dlg"><h3>${t(T[0])}</h3><p>${t(T[1])}</p><div class="act"><button class="c" data-dlg="cancel">${t('cancel')}</button><button class="p" data-dlg="off-${o.dlg}">${t('confirm')}</button></div></div>`;
    dlg=`<div class="dlgdim">${mk(1,d,'width:100%')}</div>`; }
  if(o.dlg==='consent'){ const d=`<div class="dlg"><h3>${t('cdT')}</h3><ul><li>${t('cdS')}</li><li>${t('cdR')}</li><li>${t(dlgKind==='email'?'cdDE':'cdD')}</li><li><a data-dlg="terms">${t('cdTerms')}</a></li></ul><div class="act"><button class="p" data-dlg="cancel">${t('confirm')}</button></div></div>`;
    dlg=`<div class="dlgdim">${mk(1,d,'width:100%')}</div>`; }
  if(o.dlg==='withdrawn'){ const d=`<div class="dlg"><h3>${t('wdT')}</h3><ul><li>${t('wdS')}</li><li>${t('wdR')}</li><li>${t(dlgKind==='email'?'wdDE':'wdD')}</li></ul><div class="act"><button class="p" data-dlg="cancel">${t('confirm')}</button></div></div>`;
    dlg=`<div class="dlgdim">${mk(1,d,'width:100%')}</div>`; }
  return `<div class="view"><div class="shead"><button class="ibtn" data-go="NI-M02-a">${I.back}</button></div><div class="stitle">${t('sTitle')}</div>${bn}
    <div class="sgrp">${row('ess','sEss','sEssD')}${row('mkt','sMkt','sMktD')}</div>
    <div class="sgrp">${row('email','sEmail')}</div></div>${dlg}${o.toast?toast(o.toast[0],o.toast[1],o.toast[2]):''}`;
}

function screenHTML(id){
  switch(id){
    case "NI-M01-a": return home(false,1);
    case "NI-M01-b": return home(true,1);
    case "NI-M02-a": return inbox({hm:[1,1],mark:{n1:2,n2:3}});
    case "NI-M02-b": return inbox({body:'loading'});
    case "NI-M02-c": return inbox({body:'empty'});
    case "NI-M02-d": return inbox({body:'error'});
    case "NI-M02-e": return inbox({body:'moreErr'});
    case "NI-M03-a": return inbox({banner:true,bm:1});
    case "NI-M03-b": return bgInbox()+`<div class="osdim">${iosAlert()}</div>`;
    case "NI-M03-c": return bgInbox()+`<div class="osdim">${androidAlert()}</div>`;
    case "NI-M03-d": return inS()?settings({toast:['tOn',true,1]}):inbox({toast:['tOn',true,1]});
    case "NI-M03-e": return inS()?settings({off:true,toast:['tOff',false,1]}):inbox({banner:true,toast:['tOff',false,1]});
    case "NI-M03-f": return inS()?settings({toast:['tOn',true,1]}):inbox({toast:['tOn',true,1]});
    case "NI-M03-g": return inS()?settings({off:true,toast:['tOff',false,1]}):inbox({banner:true,toast:['tOff',false,1]});
    case "NI-M03-h": return inbox({mark:{n1:1}});
    case "NI-M04-a": return inbox({mark:{n1:1}});
    case "NI-M05-a": return home(false)+push(1);
    case "NI-M05-b": return inbox({mark:{n1:1}});
    case "NI-M06-a": return settings({m:{ess:1,mkt:2,email:3}});
    case "NI-M06-b": return settings({off:true,m:{bn:1}});
    case "NI-M06-c": return settings({dlg:'ess'});
    case "NI-M06-d": return settings({dlg:'mkt'});
    case "NI-M06-e": return settings({dlg:'consent'});
    case "NI-M06-f": return settings({dlg:'withdrawn'});
  }
  return "";
}

/* ================= 렌더 ================= */
const curId=()=>`${SCREENS[sIdx].id}-${SCREENS[sIdx].cases[cIdx].k}`;
function render(){
  const sc=SCREENS[sIdx], cs=sc.cases[cIdx], id=curId();
  if(!keepState){ if(!/^NI-M03-[b-g]$/.test(id)) bgCtx="inbox"; if(id.startsWith("NI-M06")){ sst={ess:1,mkt:1,email:1}; dlgKind="mkt"; } if(id==="NI-M06-f") sst.mkt=0; }
  keepState=false;
  if(id==="NI-M04-a"||id==="NI-M05-b") readSet.add("n1");
  $('#scr').innerHTML=sbar()+screenHTML(id);
  $('#sel').value=sIdx;
  $('#cases').innerHTML=sc.cases.map((c,i)=>`<button class="case${i===cIdx?' on':''}" data-i="${i}"><code>${sc.id}-${c.k}</code>${c.label}</button>`).join("");
  $('#pBody').innerHTML=`<span class="p-id">${id}</span><div class="p-title">${cs.title}</div>
    <ul class="p-list">${cs.bullets.map(b=>`<li>${plab(b)}</li>`).join("")}</ul>
    ${cs.items.map((it,i)=>`<div class="p-item" data-n="${i+1}"><h4><span class="n">${i+1}</span>${it.h}</h4><ul>${it.b.map(x=>`<li>${plab(x)}</li>`).join("")}</ul></div>`).join("")}`;
  $('#cnt').textContent=cs.items.length;
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
  if(id==="NI-M02-e"){ const l=$('#ilist'); if(l) l.scrollTop=l.scrollHeight; }
  fit();
}
let keepState=false;
const goKeep=id=>{ keepState=true; goId(id); };
const plab=x=>x.replace(/^([^:<]{1,16}):\s*/,'<b class="plb">$1</b> ');
function goId(id){ const m=id.match(/^(NI-M\d\d)-([a-z])$/); if(!m) return false;
  const s=SCREENS.findIndex(x=>x.id===m[1]); if(s<0) return false;
  const c=SCREENS[s].cases.findIndex(x=>x.k===m[2]); if(c<0) return false;
  sIdx=s; cIdx=c; render(); return true; }

/* ================= 인터랙션 ================= */
let ttTimer;
function ttoast(msg){ let el=$('#scr .ttoast'); if(!el){el=document.createElement('div');el.className='ttoast';$('#scr').appendChild(el);} el.textContent=msg; el.classList.add('on'); clearTimeout(ttTimer); ttTimer=setTimeout(()=>el.classList.remove('on'),2400); }
function settingsApp(){ // 시스템 화면 예시: 기기 설정 앱 > Paybacks > 알림
  const ko=lang==='ko';
  const el=document.createElement('div'); el.className='setapp';
  el.innerHTML=`<div class="syslbl">시스템 화면 · 기기 설정 앱 (예시)</div><div class="nb">‹ Paybacks</div><h3>${ko?'알림':'Notifications'}</h3>
    <div class="grp2"><div class="rw"><span>${ko?'알림 허용':'Allow Notifications'}</span><button class="sw" id="swA"></button></div></div>
    <div class="cap">스위치를 켜거나 그대로 두고 아래 버튼으로 앱에 돌아가 보세요.</div>
    <button class="back" id="swBack">Paybacks 앱으로 돌아가기</button>`;
  $('#scr').appendChild(el);
  el.querySelector('#swA').addEventListener('click',e=>e.currentTarget.classList.toggle('on'));
  el.querySelector('#swBack').addEventListener('click',()=>goId(el.querySelector('#swA').classList.contains('on')?"NI-M03-f":"NI-M03-g"));
}
$('#scr').addEventListener('click',e=>{
  const tgEl=e.target.closest('[data-tg]');
  if(tgEl){ const k=tgEl.dataset.tg;
    if(sst[k]){ if(k==='ess') return goKeep("NI-M06-c"); if(k==='mkt') return goKeep("NI-M06-d"); sst.email=0; dlgKind='email'; return goKeep("NI-M06-f"); }
    sst[k]=1; if(k==='mkt'||k==='email'){ dlgKind=k; return goKeep("NI-M06-e"); } return render(); }
  const dEl=e.target.closest('[data-dlg]');
  if(dEl){ const v=dEl.dataset.dlg;
    if(v==='terms') return ttoast("[프로토타입] 마케팅 정보 수신 약관 팝업 (기존 화면)");
    if(v==='off-ess') sst.ess=0; if(v==='off-mkt'){ sst.mkt=0; dlgKind='mkt'; return goKeep("NI-M06-f"); }
    return goKeep(curId()==="NI-M06-b"?"NI-M06-b":"NI-M06-a"); }
  const itEl=e.target.closest('[data-item]');
  if(itEl){ readSet.add(itEl.dataset.item); keepState=true; return render(); } // 이동 없음 · 읽음 처리만
  const b=e.target.closest('[data-go]'); if(!b) return;
  const g=b.dataset.go;
  if(g==="back") return goId("NI-M01-a");
  if(g==="settingsPage") return goId("NI-M06-a");
  if(g==="turnon"){ bgCtx=curId().startsWith("NI-M06")?"settings":"inbox"; keepState=true; if(osMode==="ios") return goId("NI-M03-b"); if(osMode==="android") return goId("NI-M03-c"); return settingsApp(); }
  goId(g);
});
$('#pBody').addEventListener('click',e=>{ const it=e.target.closest('.p-item'); if(!it) return;
  const m=$(`#scr .mk[data-n="${it.dataset.n}"]`); if(!m) return; m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash'); });
$('#sel').innerHTML=SCREENS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join("");
$('#sel').addEventListener('change',e=>{bgCtx='inbox';sIdx=+e.target.value;cIdx=0;render();});
$('#prevS').addEventListener('click',()=>{sIdx=(sIdx-1+SCREENS.length)%SCREENS.length;cIdx=0;render();});
$('#nextS').addEventListener('click',()=>{sIdx=(sIdx+1)%SCREENS.length;cIdx=0;render();});
$('#cases').addEventListener('click',e=>{const b=e.target.closest('.case'); if(!b) return; bgCtx='inbox'; cIdx=+b.dataset.i; render();});
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.classList.toggle('on',x===b)); cb(b.dataset.v);});}
seg('#langSeg',v=>{lang=v;keepState=true;render();});
seg('#zoomSeg',v=>{zoom=v;fit();});
seg('#osSeg',v=>{osMode=v;});
$('#mkChk').addEventListener('change',e=>document.body.classList.toggle('show-mk',e.target.checked));
$('#panelBtn').addEventListener('click',()=>{$('#panel').classList.toggle('off');fit();});
$('#pClose').addEventListener('click',()=>{$('#panel').classList.add('off');fit();});
$('#resetBtn').addEventListener('click',()=>{readSet=new Set(); goId("NI-M01-b");});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(h && h!==curId()) goId(h);});
window.addEventListener('resize',fit);
function fit(){
  document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');
  const cv=$('#canvas'), H=828, W=391; let s=1;
  if(zoom==="fit") s=Math.min(1,(cv.clientHeight-40)/H,(cv.clientWidth-40)/W);
  s=Math.max(.4,s);
  $('#stage').style.transform=`scale(${s})`; $('#stage').style.height=(H*s)+'px'; $('#stage').style.width=W+'px';
  $('#status').textContent=`고정 폭 375px · iOS · Android 앱 · ${zoom==="fit"?'창에 맞춤 ':''}${Math.round(s*100)}%`;
}
const h0=location.hash.slice(1);
if(!h0 || !goId(h0)) goId("NI-M01-b");
</script>
</body>
</html>
