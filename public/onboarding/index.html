<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>앱 온보딩 캐러셀 · 알림 권한 안내 · 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bar:#151a24; --bar-2:#1d2330; --bar-line:#2c3443; --bar-text:#e8ebf1; --bar-dim:#8f98a8;
  --canvas:#e6e8ec; --mk:#e2367a; --case:#1f47d8;
  --tm-blue:#0031c6; --tm-blue-hover:#0028a3; --tm-bar-blue:#2453f0; --tm-page:#f8fafc; --tm-paper:#fff;
  --tm-text:rgba(0,0,0,.87); --tm-text-2:rgba(0,0,0,.6); --tm-text-3:rgba(0,0,0,.38); --tm-divider:rgba(0,0,0,.12);
  --tm-grey-chip:#e6e7e9; --tm-success:#1b5e20; --tm-success-bg:#c8e6c9;
  --font-ko:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-tm:"Inter","Noto Sans KR",system-ui,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font-ko);font-size:14px;color:#111;background:var(--canvas);overflow:hidden}
button{font-family:inherit;cursor:pointer}

/* ---------- toolbar ---------- */
.top{background:var(--bar);color:var(--bar-text)}
.row1{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 14px}
.row1 h1{font-size:15px;font-weight:700}
.r1-right{display:flex;align-items:center;gap:10px}
.seg{display:flex;background:var(--bar-2);border:1px solid var(--bar-line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--bar-dim);font-size:12px;font-weight:600;padding:5px 9px;border-radius:5px;white-space:nowrap}
.seg button.on{background:#fff;color:#111}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--bar-text);cursor:pointer;user-select:none}
.chk input{width:15px;height:15px;accent-color:var(--tm-bar-blue)}
.pbtn{display:flex;align-items:center;gap:6px;background:#fff;color:#111;border:0;border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
.pbtn .cnt{min-width:18px;height:18px;border-radius:9px;background:var(--mk);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.row2{min-height:42px;display:flex;align-items:center;gap:8px;padding:6px 14px;border-top:1px solid var(--bar-line);background:var(--bar-2);flex-wrap:wrap}
.lbl{font-size:12px;color:var(--bar-dim);margin:0 2px 0 4px}
.nav{width:28px;height:30px;border-radius:7px;border:1px solid var(--bar-line);background:#0e121a;color:var(--bar-text);font-size:15px}
.sel{height:32px;background:#0e121a;color:var(--bar-text);border:1px solid var(--bar-line);border-radius:8px;padding:0 10px;font-size:13px;min-width:250px;font-family:inherit}
.cases{display:flex;gap:6px;flex-wrap:wrap}
.case{display:flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;border:1px solid var(--bar-line);background:transparent;color:var(--bar-dim);font-size:13px;white-space:nowrap}
.case code{font-family:var(--font-mono);font-size:10.5px;background:rgba(255,255,255,.08);padding:2px 5px;border-radius:4px}
.case.on{background:var(--case);border-color:var(--case);color:#fff}
.case.on code{background:rgba(255,255,255,.2)}
.vsep{width:1px;height:20px;background:var(--bar-line);margin:0 2px}
.reset{height:30px;border:0;border-radius:8px;background:#fff;color:#111;font-size:13px;font-weight:600;padding:0 10px}

/* ---------- main ---------- */
.main{display:flex;height:calc(100vh - var(--toph,88px))}
.canvas{flex:1;overflow:auto;position:relative;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.stage{transform-origin:top center}
.status{position:fixed;left:10px;bottom:10px;background:#2b313d;color:#fff;font-size:12px;padding:5px 9px;border-radius:6px;z-index:5}
.panel{width:350px;flex:none;background:#fff;border-left:1px solid #d9dce3;overflow:auto;display:flex;flex-direction:column}
.panel.off{display:none}
.p-head{display:flex;align-items:center;justify-content:space-between;padding:14px 14px 10px}
.p-head b{font-size:14px}
.p-head small{font-size:12px;color:#888;margin-left:6px;font-weight:400}
.p-x{border:0;background:transparent;font-size:18px;color:#666}
.p-body{padding:0 14px 14px;flex:1}
.p-id{display:inline-block;font-family:var(--font-mono);font-size:11px;background:#eef0f4;color:#444;padding:3px 6px;border-radius:4px;margin:6px 0 10px}
.p-title{font-size:15px;font-weight:700;margin-bottom:10px;line-height:1.4}
.p-list{padding-left:16px;margin-bottom:12px}
.p-list li{font-size:13px;line-height:1.55;margin-bottom:4px;color:#222}
.p-item{margin-bottom:10px;cursor:pointer;border-radius:8px;padding:4px 4px 2px;margin-left:-4px}
.p-item:hover{background:#f6f7f9}
.p-item h4{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;margin-bottom:4px}
.p-item h4 .n{position:static}
.p-item ul{padding-left:30px}
.p-item li{font-size:12.5px;line-height:1.55;color:#333;margin-bottom:2px}
.p-foot{border-top:1px solid #eee;padding:12px 14px;font-size:12px;color:#777;line-height:1.55}

/* markers */
.n{width:22px;height:22px;border-radius:50%;background:var(--mk);color:#fff;font:700 11px/22px var(--font-ko);text-align:center;flex:none}
.mk{position:relative}
.mk>.n{position:absolute;left:-9px;top:-9px;z-index:30;width:18px;height:18px;font-size:10px;line-height:18px;display:none}
body.show-mk .mk{outline:1px dashed var(--mk);outline-offset:2px}
body.show-mk .mk>.n{display:block}
.mk.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 rgba(226,54,122,0)}50%{box-shadow:0 0 0 6px rgba(226,54,122,.35)}}

/* ---------- phone ---------- */
.phone{width:391px;height:828px;border:8px solid #111;border-radius:48px;background:#111;position:relative;box-shadow:0 10px 30px rgba(15,23,42,.18)}
.scr{position:absolute;inset:0;border-radius:40px;overflow:hidden;background:var(--tm-page);font-family:var(--font-tm);color:var(--tm-text)}
.sbar{height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 28px 0 34px;font:600 15px/1 -apple-system,var(--font-tm);color:#000;position:relative;z-index:2}
.sbar .ic{display:flex;gap:6px;align-items:center}
.sbar .ic i{display:block;background:#000;border-radius:2px}
.island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;border-radius:20px;background:#000;z-index:60}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#111;z-index:60}

/* app home */
.ahead{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{display:flex;align-items:center;gap:6px;color:var(--tm-blue);font-weight:700;font-size:19px;letter-spacing:-.2px}
.logo svg{width:26px;height:14px}
.aicons{display:flex;gap:14px}
.aicons svg{width:22px;height:22px}
.abody{padding:4px 16px}
.card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 4px rgba(15,23,42,.06)}
.balrow{display:flex;align-items:center;justify-content:space-between}
.balrow b{font-size:20px;font-weight:700}
.balrow small{display:block;font-size:12px;color:var(--tm-text-2);margin-top:2px}
.wbtn{background:var(--tm-bar-blue);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;font-family:inherit}
.sech{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:15px;margin-bottom:10px}
.sech a{font-size:12px;color:var(--tm-bar-blue);font-weight:500}
.empty{border:1px dashed #c9ceda;border-radius:10px;padding:16px;text-align:center;color:var(--tm-text-2);font-size:13px}
.empty button{margin-top:10px;background:#fff;border:1px solid var(--tm-blue);color:var(--tm-blue);border-radius:8px;padding:8px 14px;font-weight:600;font-size:13px;font-family:inherit}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{height:92px;border-radius:10px;background:linear-gradient(135deg,#171b27,#323a52)}

/* modal carousel */
.dim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:center;justify-content:center}
.modal{width:327px;background:#fff;border-radius:20px;overflow:visible;position:relative}
.mtop{display:flex;justify-content:flex-end;padding:10px 10px 0}
.xbtn{width:32px;height:32px;border:0;background:transparent;color:var(--tm-text-3);font-size:22px;line-height:1}
.mpage{padding:0 22px;touch-action:pan-y;user-select:none;cursor:grab}
.mpage.in-l{animation:inl .25s ease}
.mpage.in-r{animation:inr .25s ease}
@keyframes inl{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes inr{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
.ill{height:148px;border-radius:14px;background:#f1f4ff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:18px}
.stepl{font-size:12px;font-weight:600;color:var(--tm-bar-blue);margin-bottom:6px}
.mtitle{font-size:19px;font-weight:700;line-height:1.35;margin-bottom:8px;word-break:keep-all}
.mdesc{font-size:14px;line-height:1.55;color:var(--tm-text-2);word-break:keep-all}
.mlist{list-style:none;margin-top:10px}
.mlist li{display:flex;align-items:center;gap:8px;font-size:14px;padding:5px 0}
.mlist li::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tm-bar-blue)}
.dots{display:flex;gap:6px;justify-content:center;padding:16px 0 14px}
.dots i{width:6px;height:6px;border-radius:3px;background:#d3d7e2}
.dots i.on{width:18px;background:var(--tm-blue)}
.mact{padding:0 18px 18px;display:flex;flex-direction:column;gap:6px;min-height:108px}
.btnp{width:100%;height:48px;border-radius:10px;border:0;background:var(--tm-blue);color:#fff;font-weight:600;font-size:15px;font-family:inherit}
.btnp:hover{background:var(--tm-blue-hover)}
.btng{width:100%;height:40px;border:0;background:transparent;color:var(--tm-text-2);font-weight:500;font-size:14px;font-family:inherit}
/* illustrations */
.chipc{background:#fff;border-radius:10px;padding:8px 10px;font-size:11px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.08);line-height:1.4}
.chipc span{color:var(--tm-text-2);font-weight:500}
.arw{color:var(--tm-bar-blue);font-weight:700;margin:0 8px}
.bars{display:flex;gap:6px;align-items:flex-end;height:80px}
.bars span{width:16px;border-radius:4px 4px 0 0;background:#c7d3ff}
.bars span:last-child{background:var(--tm-bar-blue)}
.coin{position:absolute;right:48px;top:28px;background:#2e7d32;color:#fff;border-radius:999px;padding:4px 10px;font-size:11px;font-weight:700}
.mini{width:206px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.mini b{font-size:16px}.mini small{display:block;font-size:11px;color:var(--tm-text-2)}
.mini .wbtn{width:100%;margin-top:10px}
.noti{width:240px;background:#fff;border-radius:14px;padding:9px 11px;box-shadow:0 3px 10px rgba(0,0,0,.1);display:flex;gap:10px;align-items:flex-start;font-size:12px;margin:4px 0}
.noti .app{width:28px;height:28px;border-radius:7px;background:var(--tm-blue);flex:none;display:flex;align-items:center;justify-content:center}
.noti .app svg{width:18px;height:10px}
.noti b{display:block;font-size:12px}.noti small{color:var(--tm-text-2)}
.offill{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--tm-text-2);font-size:12px}
.bell{width:52px;height:52px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}

/* iOS alert */
.osdim{position:absolute;inset:0;background:rgba(0,0,0,.28);z-index:40;display:flex;align-items:center;justify-content:center}
.ios{width:272px;background:rgba(242,242,247,.98);border-radius:14px;text-align:center;font-family:-apple-system,"Noto Sans KR",sans-serif;color:#000}
.ios .t{padding:18px 16px 4px;font-weight:600;font-size:16px;line-height:1.3}
.ios .d{padding:0 16px 16px;font-size:13px;line-height:1.4}
.ios .b{display:flex;border-top:1px solid #c8c8cc}
.ios .b>div{flex:1;display:flex}
.ios .b>div+div{border-left:1px solid #c8c8cc}
.ios .b button{flex:1;height:44px;border:0;background:transparent;font-size:16px;color:#0a7aff}
.ios .b>div+div button{font-weight:600}
.adlg{width:300px;background:#eef1f8;border-radius:28px;padding:24px 24px 16px;font-family:Roboto,"Noto Sans KR",sans-serif;color:#1a1c1e;text-align:center}
.adlg .ic{display:flex;justify-content:center;margin-bottom:16px}
.adlg .t{font-size:20px;line-height:1.35;margin-bottom:20px}
.adlg .b{display:flex;flex-direction:column;gap:8px}
.adlg .b>*{width:100%}
.adlg .b button{flex:1;height:44px;border:0;border-radius:22px;background:#d8e2ff;color:#001a41;font-size:15px;font-weight:500}

/* toast */
.toast{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:#1c1f26;color:#fff;font-size:13px;padding:11px 14px;border-radius:10px;z-index:50;width:max-content;max-width:320px;text-align:center;line-height:1.4}
.ttoast{position:absolute;left:50%;top:60px;transform:translateX(-50%);background:#1c1f26;color:#fff;font-size:12px;padding:8px 12px;border-radius:8px;z-index:70;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:320px;text-align:center}
.ttoast.on{opacity:1}


/* pre-login intro (OB-M01) */
.scr.darkscr{background:#000;color:#fff}
.sbar.dark{color:#fff}.sbar.dark .ic i{background:#fff}
.homeind.dark{background:#fff}
.intro{position:absolute;inset:47px 0 0 0;display:flex;flex-direction:column;padding:10px 16px 34px}
.segs{display:flex;gap:6px;padding:6px 0}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.85)}
.segs i.on{background:var(--tm-bar-blue)}
.ipage{flex:1;display:flex;flex-direction:column;justify-content:center;touch-action:pan-y;user-select:none;cursor:grab;padding:8px 0}
.ipage.in-l{animation:inl .25s ease}.ipage.in-r{animation:inr .25s ease}
.iill{height:230px;border-radius:18px;background:#141824;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;margin-bottom:28px}
.istep{font-size:12px;font-weight:600;color:#7d9bff;margin-bottom:8px}
.ititle{font-size:24px;font-weight:700;line-height:1.3;margin-bottom:10px;word-break:keep-all}
.idesc{font-size:15px;line-height:1.55;color:rgba(255,255,255,.7);word-break:keep-all}
.icta{display:flex;flex-direction:column;gap:10px}
.btnw{width:100%;height:48px;border-radius:10px;border:0;background:#fff;color:#111;font-weight:600;font-size:15px;font-family:inherit}
.btnp{background:var(--tm-blue)}
/* notification preview (soft-ask) */
.npv{height:auto;padding:16px 12px 14px;background:linear-gradient(160deg,#dfe6ff 0%,#c9d5ff 55%,#b9c8fb 100%);flex-direction:column;gap:0;align-items:stretch;justify-content:flex-start}
.npv-time{text-align:center;font:600 11px/1 var(--font-tm);color:rgba(20,30,70,.55);margin-bottom:9px;letter-spacing:.02em}
.npv-card{background:rgba(255,255,255,.92);border-radius:16px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 4px 14px rgba(27,42,90,.14);position:relative;z-index:2}
.npv-ic{width:34px;height:34px;border-radius:9px;background:var(--tm-blue);flex:none;display:flex;align-items:center;justify-content:center}
.npv-tx{flex:1;min-width:0;text-align:left}
.npv-hd{display:flex;justify-content:space-between;font-size:11px;color:#6b7280;margin-bottom:2px}
.npv-tt{font-size:13px;font-weight:700;color:#111;line-height:1.35}
.npv-bd{font-size:12.5px;color:#333;line-height:1.4;word-break:keep-all}
.npv-back{height:10px;margin:0 10px;background:rgba(255,255,255,.55);border-radius:0 0 12px 12px;position:relative;z-index:1}
/* carousel v2 */
.ititle em{font-style:normal;color:#7d9bff}
.istats{display:flex;gap:8px;margin-top:16px}
.ist{flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:10px 12px}
.ist b{display:block;font-size:16px;font-weight:700;color:#fff;letter-spacing:-.01em}.ist b small{font-size:11px;font-weight:600;color:rgba(255,255,255,.6)}
.ist span{display:block;font-size:11.5px;color:rgba(255,255,255,.55);margin-top:2px}
.icond{margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.5)}
.iill{margin-bottom:22px}
.iill-noti{position:absolute;left:10px;right:10px;bottom:6px}
.iill-noti .npv-card{box-shadow:0 8px 24px rgba(0,0,0,.35)}
.fl{animation:fl 3.2s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-5px)}}
@media (prefers-reduced-motion:reduce){.fl{animation:none}}
/* carousel v3 (light, per-slide scenes) */
.scr:has(.intro){background:linear-gradient(180deg,#f4f7fd 0%,#e9eef9 52%,#f6f8fd 100%)}
.intro{color:#111827}
.intro::before{content:"";position:absolute;inset:-47px 0 auto 0;height:440px;background:radial-gradient(60% 50% at 50% 38%,rgba(255,255,255,.95),rgba(255,255,255,0) 70%),linear-gradient(115deg,rgba(255,255,255,0) 40%,rgba(255,255,255,.55) 48%,rgba(255,255,255,0) 56%);pointer-events:none}
.intro>*{position:relative}
.segs i{background:rgba(0,49,198,.12)}.segs i.on{background:var(--tm-blue)}
.istep{color:var(--tm-blue)}
.ititle{color:#111827;font-size:25px;letter-spacing:-.02em}.ititle em{color:var(--tm-blue)}
.idesc{color:#4b5563}
.icond{color:#8a93a6}
.icta .btnw{background:#fff;border:1px solid #d6dcea;color:#111827}
.ist{background:#fff;border:1px solid #e3e8f2;box-shadow:0 2px 8px rgba(20,40,100,.04)}
.ist b{color:var(--tm-blue)}.ist b small{color:#6b7385}.ist span{color:#6b7385}
.hero{position:relative;height:318px;margin:0 -16px 14px;overflow:visible}
.hero .glow{position:absolute;left:50%;top:46%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;background:radial-gradient(circle,rgba(120,150,255,.22),rgba(120,150,255,0) 65%)}
/* glass UI fragments */
.gl{position:absolute;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);border-radius:16px;box-shadow:0 14px 34px -10px rgba(25,45,110,.28),0 2px 6px rgba(25,45,110,.06)}
/* slide 1 */
.logo3d{position:absolute;left:50%;top:-6px;width:236px;margin-left:-118px;animation:lf 5s ease-in-out infinite}
@keyframes lf{50%{transform:translateY(-6px)}}
.linkdot{position:absolute;left:50%;top:186px;width:34px;height:34px;margin-left:-17px;border-radius:50%;background:#fff;box-shadow:0 6px 16px rgba(0,49,198,.25);display:flex;align-items:center;justify-content:center;z-index:2}
.linkln{position:absolute;left:50%;top:150px;height:64px;border-left:2px dashed rgba(0,49,198,.35)}
.uidcard{left:50%;width:286px;margin-left:-143px;top:218px;padding:14px 16px}
.uc-h{display:flex;align-items:center;gap:8px;font-size:14px}
.uc-h .ex{width:26px;height:26px;border-radius:8px;background:linear-gradient(145deg,#2ad1c4,#0f9c9a);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.uc-h b{flex:1;font-weight:700}

    case "OB-M03-b": return osBg()+`<div class="osdim">${androidAlert()}</div>`;
    case "OB-M04-a": return home()+toastAt(1,'tOn');
    case "OB-M04-b": return mk(2,`<div>${home()}</div>`)+toastAt(1,'tOff');
    case "OB-M04-c": return mk(1,`<div>${home()}</div>`);
    case "OB-M04-d": return home()+toastAt(1,'tOn');
    case "OB-M04-e": return mk(2,`<div>${home()}</div>`)+toastAt(1,'tOff');
  }
  return "";
}

/* ================= main render ================= */
const curId=()=>`${SCREENS[sIdx].id}-${SCREENS[sIdx].cases[cIdx].k}`;
function render(){
  const sc=SCREENS[sIdx], cs=sc.cases[cIdx], id=curId();
  if(id==='OB-M03-a') osPlat='ios'; if(id==='OB-M03-b') osPlat='android';
  const dark=id.startsWith("OB-M01");
  $('#scr').classList.toggle('darkscr',dark);
  $('#scr').innerHTML=sbar(dark)+screenHTML(id);
  clearTimeout(autoT); if(id==="OB-M01-a"||id==="OB-M01-b") autoT=setTimeout(()=>{ if(curId()===id) carouselStep(1); },IND_DUR);
  dir="";
  $('#sel').value=sIdx;
  $('#cases').innerHTML=sc.cases.map((c,i)=>`<button class="case${i===cIdx?' on':''}" data-i="${i}"><code>${sc.id}-${c.k}</code>${c.label}</button>`).join("");
  $('#pBody').innerHTML=`<span class="p-id">${id}</span><div class="p-title">${cs.title}</div>
    <ul class="p-list">${cs.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>
    ${cs.items.map((it,i)=>`<div class="p-item" data-n="${i+1}"><h4><span class="n">${i+1}</span>${it.h}</h4><ul>${it.b.map(x=>`<li>${x}</li>`).join("")}</ul></div>`).join("")}`;
  $('#cnt').textContent=cs.items.length;
  if(location.hash!=="#"+id) history.replaceState(null,"","#"+id);
  bindSwipe(); fit();
}
function goId(id){
  const m=id.match(/^(OB-M\d\d)-([a-z])$/); if(!m) return false;
  const s=SCREENS.findIndex(x=>x.id===m[1]); if(s<0) return false;
  const c=SCREENS[s].cases.findIndex(x=>x.k===m[2]); if(c<0) return false;
  sIdx=s; cIdx=c; render(); return true;
}
const IND_DUR=5000; let autoT; // 캐러셀 자동 넘김 (1·2장), 3장은 정지
function carouselStep(delta){
  const order=["OB-M01-a","OB-M01-b","OB-M01-c"];
  const i=order.indexOf(curId()); if(i<0) return;
  const j=i+delta; if(!delta||j<0||j>=order.length) return;
  dir=delta>0?"in-l":"in-r"; goId(order[j]);
}

/* ================= interactions ================= */
let ttTimer;
function ttoast(msg){ let el=$('#scr .ttoast'); if(!el){el=document.createElement('div');el.className='ttoast';$('#scr').appendChild(el);} el.textContent=msg; el.classList.add('on'); clearTimeout(ttTimer); ttTimer=setTimeout(()=>el.classList.remove('on'),2400); }
$('#scr').addEventListener('click',e=>{
  const d=e.target.closest('[data-dot]');
  if(d){ const order=["OB-M01-a","OB-M01-b","OB-M01-c"], i=order.indexOf(curId()); return carouselStep(+d.dataset.dot-1-i); }
  const b=e.target.closest('[data-go]'); if(!b) return;
  const g=b.dataset.go;
  if(g==="auth"){ goId("OB-M02-a"); return ttoast("[프로토타입] 회원가입·로그인 완료 후 홈 진입"); }
  if(g==="settings"){ return ttoast("[프로토타입] 앱 설정 페이지로 이동"); }
  if(g==="os"){ return goId(osPlat==="android"?"OB-M03-b":"OB-M03-a"); }
  goId(g);
});
function bindSwipe(){
  const el=$('#swipe'); if(!el) return; let x0=null;
  el.addEventListener('pointerdown',e=>{x0=e.clientX; el.setPointerCapture(e.pointerId);});
  el.addEventListener('pointerup',e=>{ if(x0===null) return; const dx=e.clientX-x0; x0=null; if(Math.abs(dx)>40) carouselStep(dx<0?1:-1); });
  el.addEventListener('pointercancel',()=>x0=null);
}
$('#pBody').addEventListener('click',e=>{
  const it=e.target.closest('.p-item'); if(!it) return;
  const m=$(`#scr .mk[data-n="${it.dataset.n}"]`); if(!m) return;
  m.classList.remove('flash'); void m.offsetWidth; m.classList.add('flash');
});
$('#sel').innerHTML=SCREENS.map((s,i)=>`<option value="${i}">${s.name}</option>`).join("");
$('#sel').addEventListener('change',e=>{sIdx=+e.target.value;cIdx=0;render();});
$('#prevS').addEventListener('click',()=>{sIdx=(sIdx-1+SCREENS.length)%SCREENS.length;cIdx=0;render();});
$('#nextS').addEventListener('click',()=>{sIdx=(sIdx+1)%SCREENS.length;cIdx=0;render();});
$('#cases').addEventListener('click',e=>{const b=e.target.closest('.case'); if(!b) return; cIdx=+b.dataset.i; render();});
function seg(id,cb){$(id).addEventListener('click',e=>{const b=e.target.closest('button'); if(!b) return; [...$(id).children].forEach(x=>x.classList.toggle('on',x===b)); cb(b.dataset.v);});}
seg('#langSeg',v=>{lang=v;render();});
seg('#zoomSeg',v=>{zoom=v;fit();});
$('#mkChk').addEventListener('change',e=>document.body.classList.toggle('show-mk',e.target.checked));
$('#panelBtn').addEventListener('click',()=>{$('#panel').classList.toggle('off');fit();});
$('#pClose').addEventListener('click',()=>{$('#panel').classList.add('off');fit();});
$('#resetBtn').addEventListener('click',()=>{goId("OB-M01-a");});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(h && h!==curId()) goId(h);});
window.addEventListener('resize',fit);
document.addEventListener('keydown',e=>{ if(e.target.tagName==='SELECT') return; if(e.key==='ArrowRight') carouselStep(1); if(e.key==='ArrowLeft') carouselStep(-1); });

function fit(){
  document.documentElement.style.setProperty('--toph',$('#top').offsetHeight+'px');
  const cv=$('#canvas'), H=828, W=391;
  let s=1;
  if(zoom==="fit") s=Math.min(1,(cv.clientHeight-40)/H,(cv.clientWidth-40)/W);
  s=Math.max(.4,s);
  $('#stage').style.transform=`scale(${s})`;
  $('#stage').style.height=(H*s)+'px';
  $('#stage').style.width=W+'px';
  $('#status').textContent=`고정 폭 375px · iOS · Android 앱 · ${zoom==="fit"?'창에 맞춤 ':''}${Math.round(s*100)}%`;
}

/* init */
const h0=location.hash.slice(1);
if(!h0 || !goId(h0)) goId("OB-M01-a");
</script>
</body>
</html>
