<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동 출금 전 잔액 출금 · 프로토타입</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/wanteddev/wanted-sans@v1.0.3/packages/wanted-sans/fonts/webfonts/variable/split/WantedSansVariable.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Prototype shell follows the daily-vote prototype. Service screens follow the live tethermax.co logged-in pages (Nov 2026): dashboard rail 347px + main column, UID details swap the rail, mobile 375 with sticky Auto Claim. */
:root {
  --tm-blue: #0031c6;
  --tm-blue-hover: #0028a3;
  --tm-bar-blue: #2453f0;
  --tm-text: rgba(0,0,0,.87);
  --tm-text-2: rgba(0,0,0,.6);
  --tm-text-3: rgba(0,0,0,.38);
  --tm-divider: rgba(0,0,0,.12);
  --tm-page: #f8fafc;
  --tm-paper: #ffffff;
  --tm-success: #1b5e20;
  --tm-success-bg: #c8e6c9;
  --tm-success-dot: #2e7d32;
  --tm-warn: #e65100;
  --tm-warn-bg: #fff3e0;
  --tm-grey-chip: #e6e7e9;
  --bar: #151a24;
  --bar-2: #1d2330;
  --bar-line: #2c3443;
  --bar-text: #e8ebf1;
  --bar-dim: #8f98a8;
  --canvas: #e6e8ec;
  --mk: #e2367a;
  --font-tm: "Wanted Sans Variable", "Wanted Sans", "Inter", "Noto Sans KR", system-ui, sans-serif;
  --font-ko: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, monospace;
  --card-shadow: 0 1px 4px rgba(15,23,42,.06);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--canvas); font-family: var(--font-ko); font-size: 14px; color: #111; display: flex; flex-direction: column; overflow: hidden; }
button, select { font: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid #5b8cff; outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ===== prototype toolbar ===== */
.bar1 { background: var(--bar); color: var(--bar-text); display: flex; align-items: center; gap: 14px; padding: 10px 16px; flex: none; flex-wrap: wrap; }
.bar1 h1 { margin: 0; font-size: 15px; font-weight: 700; }
.ver { background: #1f47d8; color: #fff; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 6px; }
.sp { margin-left: auto; }
.seg { display: inline-flex; background: #0e121a; border: 1px solid var(--bar-line); border-radius: 8px; padding: 2px; }
.seg button { border: 0; background: transparent; color: var(--bar-dim); padding: 5px 11px; border-radius: 6px; font-size: 13px; font-weight: 600; }
.seg button[aria-pressed="true"] { background: #fff; color: #111; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; }
.chk input { accent-color: #3d6bff; width: 16px; height: 16px; }
.btn-bar { background: #fff; color: #111; border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; }
.badge { background: var(--mk); color: #fff; border-radius: 10px; font-size: 11px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; padding: 0 6px; }
.bar2 { background: var(--bar-2); color: var(--bar-text); display: flex; align-items: center; gap: 10px; padding: 8px 16px; flex: none; flex-wrap: wrap; border-top: 1px solid var(--bar-line); }
.lbl { font-size: 12px; color: var(--bar-dim); }
.arrow { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--bar-line); background: #0e121a; color: var(--bar-text); }
.sel { background: #0e121a; color: var(--bar-text); border: 1px solid var(--bar-line); border-radius: 8px; padding: 6px 10px; min-width: 280px; font-size: 13px; }
.cases { display: flex; gap: 6px; flex-wrap: wrap; }
.case { border: 1px solid var(--bar-line); background: #0e121a; color: var(--bar-dim); border-radius: 8px; padding: 5px 10px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.case code { font-family: var(--font-mono); font-size: 11px; background: rgba(255,255,255,.08); padding: 1px 6px; border-radius: 4px; }
.case[aria-pressed="true"] { background: #1f47d8; border-color: #1f47d8; color: #fff; }
.vsep { width: 1px; height: 22px; background: var(--bar-line); }

.work { flex: 1; display: flex; min-height: 0; }
.canvas { flex: 1; overflow: auto; padding: 24px; }
.stagebox { margin: 0 auto; }
.scaler { transform-origin: top left; }
.status { position: fixed; left: 12px; bottom: 12px; background: #2b313d; color: #fff; font-size: 12px; padding: 5px 10px; border-radius: 6px; pointer-events: none; }

.panel { width: 350px; flex: none; background: #fff; border-left: 1px solid #d7dbe2; display: flex; flex-direction: column; min-height: 0; }
.panel[hidden] { display: none; }
.panel-head { display: flex; align-items: center; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #eceff3; }
.panel-head h2 { margin: 0; font-size: 15px; }
.panel-head small { color: #6b7280; font-size: 12px; }
.panel-head button { margin-left: auto; border: 0; background: transparent; font-size: 18px; color: #6b7280; }
.panel-body { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.p-ids { display: flex; gap: 6px; flex-wrap: wrap; }
.p-ids span { font-family: var(--font-mono); font-size: 11px; background: #eef1f6; padding: 2px 8px; border-radius: 4px; color: #374151; }
.p-title { font-size: 15px; font-weight: 700; margin: 0; }
.p-lead { margin: 0; line-height: 1.6; color: #374151; font-size: 13px; }
.p-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.p-list li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 13px; line-height: 1.55; color: #1f2937; cursor: pointer; }
.p-list .n { width: 22px; height: 22px; border-radius: 50%; background: var(--mk); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
.p-list .new { display: inline-block; font-size: 10px; font-weight: 700; color: #1f47d8; background: #e6ecff; border-radius: 3px; padding: 0 5px; margin-right: 4px; }
.p-calc { background: #f6f8fb; border: 1px solid #e3e7ee; border-radius: 8px; padding: 12px; font-size: 12px; line-height: 1.7; color: #374151; }
.p-foot { font-size: 12px; color: #6b7280; line-height: 1.6; border-top: 1px solid #eceff3; padding-top: 12px; }

.show-mk [data-n] { outline: 1.5px dashed var(--mk); outline-offset: 3px; position: relative; }
.show-mk [data-n]::after { content: attr(data-n); position: absolute; left: -9px; top: -11px; width: 18px; height: 18px; border-radius: 50%; background: var(--mk); color: #fff; font: 700 10px/18px var(--font-ko); text-align: center; z-index: 40; pointer-events: none; }
@keyframes flash { 0%,100% { outline-color: var(--mk); } 50% { outline-color: transparent; } }
.show-mk [data-n].flash { animation: flash .35s 3; outline-width: 2.5px; }

/* ===== TetherMax live UI ===== */
.tm { font-family: var(--font-tm); color: var(--tm-text); background: var(--tm-page); position: relative; }
.tm .card { background: var(--tm-paper); border-radius: 8px; box-shadow: var(--card-shadow); }
.tm .btn { border: 0; border-radius: 4px; font-weight: 500; font-size: 14px; height: 37px; padding: 0 16px; }
.tm .btn-primary { background: var(--tm-blue); color: #fff; }
.tm .btn-primary:hover { background: var(--tm-blue-hover); }
.tm .btn[disabled], .tm .btn-off { background: rgba(0,0,0,.12); color: rgba(0,0,0,.38); cursor: default; }
.tm .btn-block { width: 100%; }
.chip { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 11px; font-size: 12px; white-space: nowrap; }
.chip-ok { background: var(--tm-success-bg); color: var(--tm-success); }
.chip-grey { background: var(--tm-grey-chip); color: #5d6067; }
.chip-tag { background: #eceff1; color: var(--tm-text-2); border-radius: 4px; height: 20px; font-size: 11px; }

.tm-header { height: 64px; display: flex; align-items: center; padding: 0 40px; gap: 34px; background: var(--tm-paper); }
.tm-logo { display: flex; align-items: center; gap: 5px; color: var(--tm-blue); font-weight: 700; font-size: 21px; letter-spacing: -.3px; }
.tm-logo svg { width: 31px; height: 16px; }
.tm-nav { display: flex; gap: 30px; font-weight: 600; font-size: 16px; color: var(--tm-text); }
.tm-nav span::after { content: ""; display: inline-block; margin-left: 7px; border: 4px solid transparent; border-top-color: rgba(0,0,0,.54); transform: translateY(2px); }
.tm-icons { margin-left: auto; display: flex; gap: 24px; align-items: center; }
.ico { width: 22px; height: 22px; display: inline-block; color: #3c3c3f; }

.web-wrap { width: 1134px; margin: 0 auto; display: grid; grid-template-columns: 347px 1fr; gap: 28px; padding: 40px 0 60px; }
.rail { display: flex; flex-direction: column; gap: 16px; }
.main-col { display: flex; flex-direction: column; gap: 28px; }

/* balance card */
.bal { overflow: hidden; }
.bal-top { display: flex; align-items: center; min-height: 72px; padding-right: 16px; }
.bal-img { width: 65px; height: 65px; flex: none; margin: 3px 12px 3px 0; object-fit: cover; object-position: left; }
.bal-main { flex: 1; min-width: 0; }
.bal-amt { font-size: 16px; font-weight: 600; line-height: 1.5; }
.bal-label { font-size: 12px; color: var(--tm-text-2); }

/* NEW: earlier balance */
.eb { border-top: 1px solid var(--tm-divider); margin: 0 16px; padding: 14px 0 16px; display: flex; flex-direction: column; gap: 10px; }
.eb.eb-in { margin: 8px 0 0; padding-bottom: 0; }
.eb-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.eb-label { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.eb-sub { font-size: 12px; color: var(--tm-text-2); margin-top: 2px; line-height: 1.4; }
.eb-amt { font-size: 16px; font-weight: 600; white-space: nowrap; text-align: right; }
.eb-amt small { display: block; font-size: 11px; font-weight: 400; color: var(--tm-text-2); }
.eb-status { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tm-text-2); line-height: 1.45; flex-wrap: wrap; }
.info { width: 15px; height: 15px; border-radius: 50%; border: 1.2px solid var(--tm-text-3); color: var(--tm-text-2); font-size: 9px; font-weight: 700; display: inline-grid; place-items: center; position: relative; cursor: help; font-family: Inter, sans-serif; }
.info .tip { display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%); width: 250px; background: #3c3c3f; color: #fff; font-weight: 400; font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 4px; z-index: 45; font-family: var(--font-tm); }
.info:hover .tip, .info:focus .tip { display: block; }

/* linked uid */
.lu { padding: 16px; }
.lu-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.lu-head b { font-size: 16px; font-weight: 600; }
.link { color: var(--tm-blue); font-size: 13px; font-weight: 500; }
.lu-row { display: flex; align-items: center; gap: 10px; padding: 12px 0; cursor: pointer; }
.ex { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 700; flex: none; font-family: Inter, sans-serif; letter-spacing: -.2px; }
.lu-name { flex: 1; font-size: 14px; font-weight: 500; }
.lu-name small { display: block; font-size: 12px; font-weight: 400; color: var(--tm-text-2); }
.lu-amt { font-size: 14px; font-weight: 500; white-space: nowrap; }
.caret { width: 0; height: 0; border: 4px solid transparent; border-top-color: rgba(0,0,0,.54); margin-left: 6px; transform: translateY(2px); }
.lu-uids { padding: 0 0 6px 42px; display: flex; flex-direction: column; gap: 10px; }
.lu-uid { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tm-text-2); cursor: pointer; }
.lu-uid .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tm-success-dot); }
.lu-uid .amt { margin-left: auto; color: var(--tm-text); }
.lu-foot { border-top: 1px solid var(--tm-divider); margin-top: 8px; padding-top: 14px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--tm-text-2); }
.plus-ico { width: 16px; height: 16px; border-radius: 50%; border: 1.3px solid var(--tm-text-2); display: grid; place-items: center; font-size: 12px; line-height: 1; }

/* sections */
.sec { padding: 24px 24px 28px; }
.sec-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.sec-head h3 { margin: 0; font-size: 24px; font-weight: 700; }
.ben-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
.ben { border-radius: 8px; box-shadow: 0 1px 6px rgba(15,23,42,.08); padding: 16px; display: flex; flex-direction: column; gap: 10px; background: #fff; }
.ben-img { height: 140px; border-radius: 4px; background: #111 center/cover no-repeat; }
.ben-t { font-size: 14px; color: var(--tm-text-2); }
.ev-img { height: 140px; border-radius: 4px; background: linear-gradient(150deg, #0d1424, #1b2a49); position: relative; }
.ev-img span { position: absolute; left: 10px; top: 10px; background: #000; color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 3px; font-family: Inter, sans-serif; }
.ev-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--tm-text-2); }
.ev-row b { color: var(--tm-text); font-weight: 500; }
.cd { display: flex; gap: 4px; align-items: center; font-size: 12px; color: var(--tm-text-2); }
.cd i { font-style: normal; background: #f1f3f5; color: var(--tm-text); padding: 1px 5px; border-radius: 3px; }

/* uid details */
.ud-head { padding: 16px; display: flex; align-items: center; gap: 10px; }
.back { font-size: 20px; color: #3c3c3f; cursor: pointer; padding: 0 4px; }
.ud-name { flex: 1; }
.ud-name b { display: block; font-size: 16px; font-weight: 600; }
.ud-name small { font-size: 12px; color: var(--tm-text-2); white-space: nowrap; }
.ud { padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.kv { display: flex; justify-content: space-between; gap: 12px; }
.kv.big { font-size: 14px; }
.kv.big span:last-child { font-size: 16px; font-weight: 600; }
.kv.mid { font-size: 14px; color: var(--tm-text-2); }
.kv.small { font-size: 12px; color: var(--tm-text-2); }
.kv.small span:last-child { color: var(--tm-text); }
.hr { height: 1px; background: var(--tm-divider); margin: 6px 0; }
.bar { height: 4px; background: #e8eefc; border-radius: 2px; overflow: hidden; margin-top: 4px; }
.bar i { display: block; height: 100%; background: var(--tm-bar-blue); }
.cl { font-size: 11px; color: var(--tm-text-2); }
.warn { background: var(--tm-warn-bg); color: #7a3600; font-size: 13px; padding: 10px 12px; border-radius: 4px; display: flex; gap: 8px; align-items: center; }
.warn b { font-weight: 600; }
.ud-eb { border: 1px solid #d6dff7; background: #f5f8ff; border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }
.ud-eb-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; }
.ud-eb .kv { font-size: 12px; color: var(--tm-text-2); }
.ud-eb .kv span:last-child { color: var(--tm-text); }
.ud-eb .later { color: var(--tm-warn); }
.ud-eb .later span:last-child { color: var(--tm-warn); }
.ud-eb-foot { font-size: 12px; color: var(--tm-text-2); line-height: 1.45; display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 2px; }
.ud-eb-foot .link { white-space: nowrap; cursor: pointer; }
.tl { padding: 16px; }
.tl b { font-size: 16px; font-weight: 600; }
.tl-row { display: flex; justify-content: space-between; margin-top: 16px; position: relative; }
.tl-row::before { content: ""; position: absolute; left: 50px; right: 50px; top: 27px; border-top: 1px dashed #c9ced6; }
.tl-it { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100px; position: relative; font-size: 11px; color: var(--tm-text-2); }
.tl-it i { width: 54px; height: 54px; border-radius: 6px; background: #f1f3f5; display: block; }
.tl-it strong { font-weight: 500; color: var(--tm-text); font-size: 12px; }
.tl small { display: block; font-size: 11px; color: var(--tm-text-2); margin-top: 12px; }
.wk { padding: 16px 20px 24px; }
.wk-head { display: flex; justify-content: space-between; align-items: center; }
.wk-head b { font-size: 16px; font-weight: 600; }
.wk-days { display: flex; justify-content: space-between; margin-top: 18px; padding: 0 10px; font-size: 15px; }
.wk-days span { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; }
.wk-days span.on { border: 1px solid #333; }

/* modal */
.scrim { position: absolute; inset: 0; background: rgba(0,0,0,.5); z-index: 20; }
.modal { position: absolute; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 8px; box-shadow: 0 11px 15px -7px rgba(0,0,0,.2), 0 24px 38px 3px rgba(0,0,0,.14); display: flex; flex-direction: column; z-index: 21; }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 22px 24px 14px; }
.modal-head h2 { margin: 0; font-size: 20px; font-weight: 600; }
.x { border: 0; background: transparent; font-size: 24px; line-height: 1; color: #3c3c3f; padding: 2px 6px; }
.modal-body { padding: 4px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
.total { border: 1px solid var(--tm-divider); border-radius: 8px; padding: 16px; }
.total small { font-size: 12px; color: var(--tm-text-2); }
.total .amt { font-size: 26px; font-weight: 600; margin-top: 2px; }
.total .amt span { font-size: 14px; font-weight: 400; color: var(--tm-text-2); margin-left: 4px; }
.total .later { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--tm-divider); display: flex; justify-content: space-between; font-size: 13px; color: var(--tm-warn); }
.carry { margin-top: 12px; background: #f0f4ff; border: 1px solid #c9d6fb; border-radius: 6px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; }
.carry-h { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 600; color: var(--tm-blue); gap: 10px; }
.carry-h span:first-child { display: flex; align-items: center; gap: 6px; }
.carry-h svg { flex: none; }
.carry p { margin: 0; font-size: 12px; line-height: 1.5; color: var(--tm-text-2); }
.uc-rows .sub-row { padding-left: 8px; font-size: 12px; }
.uc-rows .carry-sub { color: var(--tm-blue); }
.uc { border: 1px solid var(--tm-divider); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.uc.off { background: #fafafa; }
.uc.off .uc-strong { color: var(--tm-text-3); }
.uc-head { display: flex; align-items: center; gap: 10px; }
.uc-head .ex { width: 28px; height: 28px; }
.uc-head div { flex: 1; font-size: 14px; font-weight: 600; }
.uc-head small { display: block; font-size: 12px; font-weight: 400; color: var(--tm-text-2); }
.uc-strong { display: flex; justify-content: space-between; font-size: 14px; font-weight: 500; padding-bottom: 10px; border-bottom: 1px solid var(--tm-divider); }
.uc-rows { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--tm-text-2); }
.uc-rows div { display: flex; justify-content: space-between; gap: 12px; }
.uc-rows .later { color: var(--tm-warn); padding-top: 6px; border-top: 1px dashed var(--tm-divider); }
.uc-note { font-size: 12px; color: var(--tm-text-2); background: var(--tm-page); border-radius: 4px; padding: 8px 10px; line-height: 1.5; }
.modal-foot { padding: 14px 24px 22px; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid var(--tm-divider); }
.modal-foot .kv { font-size: 13px; color: var(--tm-text-2); }
.modal-foot .kv span:last-child { color: var(--tm-text); text-align: right; }
.fine { font-size: 12px; color: var(--tm-text-2); line-height: 1.55; margin: 2px 0; }
.err-toast { background: #d32f2f; color: #fff; font-size: 13px; padding: 10px 14px; border-radius: 4px; margin-bottom: 10px; box-shadow: 0 3px 5px rgba(0,0,0,.2); }
.toast { position: absolute; left: 50%; transform: translateX(-50%); background: #323232; color: #fff; padding: 12px 18px; border-radius: 4px; font-size: 14px; z-index: 30; white-space: nowrap; box-shadow: 0 3px 5px rgba(0,0,0,.2); }

/* mobile web */
.phone { width: 393px; height: 852px; border-radius: 44px; background: #111; padding: 9px; }
.screen { width: 375px; height: 834px; border-radius: 36px; overflow: hidden; position: relative; background: var(--tm-page); display: flex; flex-direction: column; }
.m-head { height: 64px; display: flex; align-items: center; padding: 0 12px 0 10px; gap: 18px; background: var(--tm-page); flex: none; padding-top: 6px; }

  function bars() {
    const sel = document.getElementById("screen-sel");
    const hasChg = s => s.cases.some(x => CHG[s.id.slice(3).replace("M", "W") + "-" + x.k]);
    sel.innerHTML = SCREENS.map((s, i) => `<option value="${i}">${s.name} (${s.id})${S.chg && hasChg(s) ? " · 변경" : ""}</option>`).join(""); sel.value = S.si;
    const sk = cur().id.slice(3).replace("M", "W");
    document.getElementById("cases").innerHTML = cur().cases.map((x, i) => `<button class="case ${S.chg && CHG[sk + "-" + x.k] ? "chg-dot" : ""}" data-i="${i}" aria-pressed="${i === S.ci}"><code>${cur().id}-${x.k}</code>${x.name}</button>`).join("");
    document.querySelectorAll(".case").forEach(b => b.onclick = () => go(S.si, +b.dataset.i));
    ["en", "ko"].forEach(l => document.getElementById("lang-" + l).setAttribute("aria-pressed", S.lang === l));
    document.getElementById("fit-on").setAttribute("aria-pressed", S.fit); document.getElementById("fit-off").setAttribute("aria-pressed", !S.fit);
  }
  function render() {
    const c = S.inModal ? { ...cc().c, modal: true } : cc().c, dev = cur().dev;
    scaler.innerHTML = dev === "web" ? webScreen(c) : mobileScreen(c);
    document.body.classList.toggle("show-mk", S.mk);
    document.body.classList.toggle("show-chg", S.chg);
    bars();
    const ns = [...scaler.querySelectorAll("[data-n]")].map(e => +e.dataset.n);
    document.getElementById("mk-count").textContent = ns.length ? Math.max(...ns) : 0;
    document.getElementById("panel").hidden = !S.panel;
    document.getElementById("panel-body").innerHTML = panelHtml();
    document.querySelectorAll(".p-list li").forEach(li => li.onclick = () => flash(li.dataset.go));
    bind();
    requestAnimationFrame(fit);
    try { if (location.protocol !== "about:" && location.hash !== "#" + cid()) history.replaceState(null, "", "#" + cid()); } catch (e) { /* preview iframe: URL update not allowed */ }
  }
  function fit() {
    const el = scaler.firstElementChild; if (!el) return;
    const w = el.offsetWidth, h = el.offsetHeight, aw = canvas.clientWidth - 48, ah = canvas.clientHeight - 48;
    let s = 1; if (S.fit) s = isMob() ? Math.min(1, ah / h, aw / w) : Math.min(1, aw / w);
    scaler.style.transform = `scale(${s})`; stagebox.style.width = w * s + "px"; stagebox.style.height = h * s + "px";
    const d = isMob() ? "고정 폭 375px · 모바일 웹" : "고정 폭 1440px · 웹";
    document.getElementById("status").textContent = `${d} · ${S.fit ? "창에 맞춤" : "100%"} ${Math.round(s * 100)}%`;
  }
  function flash(n) {
    const el = scaler.querySelector(`[data-n="${n}"]`); if (!el) return;
    if (!S.mk) { S.mk = true; document.getElementById("mk-toggle").checked = true; document.body.classList.add("show-mk"); }
    el.scrollIntoView({ block: "center", behavior: "smooth" }); el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash");
  }
  function bind() {
    const m = isMob(), c = cc().c, hasIng = (c.ing || []).length > 0 && !c.claimed;
    const dash = m ? idx("EB-M01") : idx("EB-W01"), dlg = m ? idx("EB-M02") : idx("EB-W02"), uidS = m ? idx("EB-M03") : idx("EB-W03");
    const onUid = cur().view === "uid";
    const open = document.getElementById("open-claim");
    if (open) open.onclick = () => { if (onUid) { S.inModal = true; render(); } else go(dlg, 0); };
    const close = () => { if (onUid) { S.inModal = false; render(); } else go(dash, 0); };
    document.getElementById("close")?.addEventListener("click", close);
    document.getElementById("scrim")?.addEventListener("click", close);
    const conf = document.getElementById("confirm");
    if (conf) conf.onclick = () => { S.toast = L().toast; if (onUid) { S.inModal = false; go(S.si, 1, cc().c.uid); } else go(dash, 1); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ""; render(); }, 2600); };
    // linked uid → uid detail
    scaler.querySelectorAll("[data-uid]").forEach(el => el.onclick = e => {
      e.stopPropagation(); lastDash = S.ci; go(uidS, S.ci, el.dataset.uid);
    });
    document.getElementById("back")?.addEventListener("click", () => go(dash, S.ci));
    document.getElementById("res-ok")?.addEventListener("click", () => go(dash, 2));
    document.getElementById("res-close")?.addEventListener("click", () => go(dash, 3));
    document.getElementById("res-retry")?.addEventListener("click", () => go(dlg, 0));
    if (cur().view === "invite") {
      const ivcs = m ? idx("EB-M04") : idx("EB-W04");
      document.getElementById("iv-cs")?.addEventListener("click", () => go(ivcs, 1));
      document.getElementById("chat-close")?.addEventListener("click", () => go(ivcs, 0));
    }
  }
  let uidOverride = null, lastDash = 0;
  function go(si, ci, uid) {
    S.si = si; S.ci = ci; S.inModal = false;
    // allow viewing any linked UID within the matching case
    if (SCREENS[si].view === "uid") {
      if (uid) S.uid = uid;
      SCREENS[si].cases.forEach(x => { x.c.uid = S.uid || "850358337912128386"; });
    }
    render();
  }
  function fromHash() {
    let h = ""; try { h = location.hash; } catch (e) { return false; }
    const m = h.slice(1).match(/^(EB-[WMA]\d\d)-([a-z])$/); if (!m) return false;
    const si = idx(m[1]); if (si < 0) return false; const ci = SCREENS[si].cases.findIndex(x => x.k === m[2]); if (ci < 0) return false;
    S.si = si; S.ci = ci; return true;
  }
  document.getElementById("screen-sel").onchange = e => { S.toast = ""; go(+e.target.value, 0); };
  document.getElementById("prev").onclick = () => { S.toast = ""; go((S.si - 1 + SCREENS.length) % SCREENS.length, 0); };
  document.getElementById("next").onclick = () => { S.toast = ""; go((S.si + 1) % SCREENS.length, 0); };
  document.getElementById("lang-en").onclick = () => { S.lang = "en"; render(); };
  document.getElementById("lang-ko").onclick = () => { S.lang = "ko"; render(); };
  document.getElementById("chg-toggle").onchange = e => { S.chg = e.target.checked; render(); };
  document.getElementById("mk-toggle").onchange = e => { S.mk = e.target.checked; render(); };
  document.getElementById("panel-toggle").onclick = () => { S.panel = !S.panel; render(); };
  document.getElementById("panel-close").onclick = () => { S.panel = false; render(); };
  document.getElementById("fit-on").onclick = () => { S.fit = true; render(); };
  document.getElementById("fit-off").onclick = () => { S.fit = false; render(); };
  document.getElementById("restart").onclick = () => { S.toast = ""; go(0, 0); };
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "Escape" && cc().c.modal) document.getElementById("close")?.click();
    if (e.key === "d" || e.key === "D") { S.panel = !S.panel; render(); }
  });
  window.addEventListener("resize", fit);
  window.addEventListener("hashchange", () => { if (fromHash()) render(); });
  fromHash(); render();
})();
</script>
</body>
</html>
